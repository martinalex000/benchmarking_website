# These link-prediction papers may retain genuine link-prediction benchmark rows,
# but must never populate node-classification leaderboards.
allowed_dataset_tasks:
  "2303.08958": ["link_prediction"]
  "2210.05801": ["link_prediction"]
  "2211.14394": ["link_prediction"]

# Row-level exclusions are used when a paper has valid rows for the same
# dataset but a subset of models was shifted from an adjacent table column.
exclude_results:
  "2409.06998":
    ogbn-arxiv:
      models: [GMoE, Mowst]
      reason: "Values copied from the adjacent genius column; the OGB-arxiv column reports different values."

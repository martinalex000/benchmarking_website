  "2303.08958": ["link_prediction"]
  "2210.05801": ["link_prediction"]
  "2211.14394": ["link_prediction"]

# Row-level exclusions are used when a paper has valid rows for the same
# dataset but a subset of models was shifted from an adjacent table column.
exclude_results:
  "2502.04591":
    Amazon-ratings:
      models: [GCN]
      reason: "The value is an accuracy ratio from an oversmoothing correlation table, not benchmark test accuracy."
  "2210.02636":
    FB15k-237:
      metrics: [MRR]
      reason: "Stored values came from the inductive Hit@10 table but were labeled MRR; the transductive MRR table has different values."
    WN18RR:
      metrics: [MRR]
      reason: "Stored values came from the inductive Hit@10 table but were labeled MRR; the transductive MRR table has different values."
  "2304.04757":
    MD17:
      models: [GemNet (T/Q)]
      reason: "The source contains a dash for an unreported GemNet energy value; -1.0 is an invalid MAE sentinel."
  "2212.02229":
    PCQM4Mv2:

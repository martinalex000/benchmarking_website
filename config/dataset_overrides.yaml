# Dataset-level website display overrides.
# This file controls presentation for dataset pages, independent of per-paper overrides.
#
# Supported keys per dataset:
#   display_metrics: ordered list of metric names to show on the dataset detail page.
#   metric_labels: map canonical metric keys to human-readable column headers.
#   default_metric: default target for ranking, chart, and mobile picker.
#   show_all_metrics_desktop: when true, show all metric columns on desktop (no "+ metrics" toggle).
#   chart_default_log_scale: when true, default the leaderboard chart to a logarithmic y-axis.
#   chart_hidden_models: model names to hide from the leaderboard chart only.
#   export_without_results: set true to keep a dataset visible on the site even before
#     benchmark results have been parsed into the DB.
#
# Example:
# datasets:
#   Texas:
#     display_metrics: ["Accuracy"]

datasets:
  COVID:
    default_metric: Avg.
  LRIM:
    export_without_results: true
  Texas:
    display_metrics: ["Accuracy"]
  QM9:
    default_metric: gap
    show_all_metrics_desktop: true
    chart_default_log_scale: true
    chart_hidden_models:
      - MLP
    display_metrics:
      - gap
      - mu
      - alpha
      - U0
      - H
      - G
      - Cv
      - HOMO
      - LUMO
      - zpve
      - R2
      - U
      - omega1
    metric_labels:
      gap: "HOMO-LUMO gap (eV)"
      mu: "Dipole moment (D)"
      alpha: "Polarizability (a₀³)"
      U0: "Internal energy (U₀, eV)"
      H: "Enthalpy (H, eV)"
      G: "Free energy (G, eV)"
      Cv: "Heat capacity (cal mol⁻¹ K⁻¹)"
      HOMO: "HOMO (eV)"
      LUMO: "LUMO (eV)"
      zpve: "Zero point vibrational energy (eV)"
      R2: "Electronic spatial extent (a₀²)"
      U: "Internal energy (U, eV)"
      omega1: "Highest vibrational frequency (cm⁻¹)"

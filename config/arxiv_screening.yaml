# Unified vocabulary for arXiv audit and screening. Matching is case-insensitive.
machine_learning_categories:
  - cs.LG
  - stat.ML

# These terms form the fast, specific screening tier. The generic graph family
# below is the fallback for papers that use graph terminology without a more
# specific method name.
specific_keywords:
  - graph neural network
  - graph neural networks
  - gnn
  - gnns
  - message passing neural network
  - message passing neural networks
  - message passing
  - mpnn
  - mpnns
  - graph transformer
  - graph transformers
  - graphormer
  - graph convolutional network
  - graph convolutional networks
  - graph convolutional neural network
  - graph convolutional neural networks
  - gcn
  - gcns
  - graph attention network
  - graph attention networks
  - gat
  - gats
  - graph isomorphism network
  - graph isomorphism networks
  - gin
  - gins
  - graphsage
  - graph representation learning
  - graph machine learning
  - geometric deep learning
  - graph embedding
  - graph embeddings
  - node classification
  - node regression
  - node prediction
  - node representation learning
  - link prediction
  - edge prediction
  - edge classification
  - graph classification
  - graph regression
  - knowledge graph embedding
  - knowledge graph embeddings
  - knowledge graph completion
  - heterogeneous graph learning
  - dynamic graph learning
  - molecular graph learning
  - graph contrastive learning
  - graph self-supervised learning
  - graph autoencoder
  - graph autoencoders
  - graph foundation model
  - graph foundation models

keyword_families:
  # Deliberately a substring matcher: it covers graph, graphs, and related forms.
  graph:
    - graph
  gnn:
    - "\\bgnns?\\b"
  graph_neural_network:
    - "\\bgraph[- ]neural[- ]networks?\\b"
  graph_convolution_attention:
    - "\\bgraph[- ]convolutional(?:[- ]neural)?[- ]networks?\\b"
    - "\\bgraph[- ]attention[- ]networks?\\b"
  gcn:
    - "\\bgcns?\\b"
  gat:
    - "\\bgats?\\b"
  graph_isomorphism:
    - "\\bgraph[- ]isomorphism[- ]networks?\\b"
  gin:
    - "\\bgins?\\b"
  message_passing:
    - "\\bmessage[- ]passing(?:[- ]neural[- ]networks?)?\\b"
    - "\\bmpnns?\\b"
  graph_transformer:
    - "\\bgraph[- ]transformers?\\b"
  graphormer:
    - "\\bgraphormer\\b"
  geometric_deep_learning:
    - "\\bgeometric[- ]deep[- ]learning\\b"
  node_tasks:
    - "\\bnode[- ]classification\\b"
    - "\\bnode[- ]regression\\b"
    - "\\bnode[- ]prediction\\b"
    - "\\bnode[- ]representation[- ]learning\\b"
  link_edge_tasks:
    - "\\blink[- ]prediction\\b"
    - "\\bedge[- ]prediction\\b"
    - "\\bedge[- ]classification\\b"
    - "\\bknowledge[- ]graph[- ]completion\\b"
  graph_tasks:
    - "\\bgraph[- ]classification\\b"
    - "\\bgraph[- ]regression\\b"
  knowledge_graph:
    - "\\bknowledge[- ]graphs?\\b"
    - "\\bknowledge[- ]graph[- ]embeddings?\\b"
  graph_representation:
    - "\\bgraph[- ]representation[- ]learning\\b"
    - "\\bgraph[- ]machine[- ]learning\\b"
    - "\\bgraph[- ]embeddings?\\b"
  molecular_atomistic:
    - "\\bmolecules?\\b"
    - "\\bmolecular\\b"
    - "\\batomistic\\b"
    - "\\bneural[- ]network[- ]potentials?\\b"
    - "\\binteratomic[- ]potentials?\\b"

  - name: Chip Design
    task_type: graph_generation
    short_description: >-
      Generate a structurally efficient and-inverter graph implementing a supplied Boolean function
      while preserving the exact truth table.
    description: >-
      **Graph generation** Generate a structurally efficient and-inverter graph implementing a
      supplied Boolean function while preserving the exact truth table. Evaluated by Accuracy.
    detailed_description:
      task: Generate a structurally efficient and-inverter graph implementing a supplied Boolean function while preserving the exact truth table. Quality must account for functional equivalence as well as circuit size or synthesis cost.
      data: Samples are small directed acyclic logic circuits represented as and-inverter graphs. The benchmark uses functions and circuits produced with established logic-synthesis tooling rather than analog measurements.
      features: Nodes denote primary inputs or logic gates and directed edges carry signals; complemented edges encode inversion in the AIG representation. The Boolean function is the conditioning target for generation.
      splits_and_evaluation: GraphBench provides a fixed benchmark protocol and compares generated circuits with non-learning synthesis baselines. Exact equivalence checking is required; a visually or structurally similar graph is not sufficient.
      quirks_and_pitfalls: Circuit minimization is NP-hard and many non-isomorphic circuits implement the same function, so supervised graph matching is not a complete quality measure. Generated DAG validity, truth-table equivalence, and optimization quality are distinct requirements. The benchmark paper reports no successful learned baseline for this task.
    sources:

      **Node regression** Predict a real-valued ordering position for every node in a directed acyclic
      graph, matching the reference topological sort. Task-specific node information is provided along
      with directed topology. Evaluated by MAE.
    detailed_description:
      task: Predict a real-valued ordering position for every node in a directed acyclic graph, matching the reference topological sort.
      data: Unique synthetic graphs are drawn from six generator families and converted into valid task instances. Difficulty changes the generator mixture between train and evaluation; training graphs have 16 nodes and test graphs 128.
      features: Task-specific node information is provided along with directed topology. The label is a node-level scalar rank rather than a graph class.
      splits_and_evaluation: Each difficulty contains one million training examples and 10,000 examples in each validation and test split. Mean absolute error is reported; separate tests probe sizes from 128 through 512 nodes.
      quirks_and_pitfalls: A DAG generally admits many valid topological orders, but pointwise MAE compares against one reference order and can penalize another valid ordering. Rank scale changes with graph size, complicating raw-MAE comparisons across size-generalization sets.

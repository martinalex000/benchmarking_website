      million labeled arXiv papers while using the full 111-million-node citation network. Evaluated
      by Accuracy.
    detailed_description:
      task: Predict a primary arXiv subject area for the approximately 1.5 million labeled arXiv papers while using the full 111-million-node citation network. Accuracy over 172 classes is the official measure.
      data: Nodes are papers indexed by Microsoft Academic Graph and directed edges are citations. Most nodes are not arXiv papers and have no class label, but remain available as unlabeled graph context.
      features: As in ogbn-arxiv, every paper has a 128-dimensional average of skip-gram embeddings for title and abstract words. The fixed features and graph come from the released MAG snapshot.
      splits_and_evaluation: Labeled arXiv papers through 2017 train the model, papers from 2018 validate it, and papers from 2019 onward form test. The task is transductive because features and topology for all nodes are supplied.
      quirks_and_pitfalls: >-
        Dataset scale makes full-batch processing impractical and often forces sampling or partitioning choices that affect results. The overwhelming majority of nodes are unlabeled. This is not simply a scaled ogbn-arxiv: it uses 172 subjects and a much broader MAG graph.

      task: Predict a binary label for every edge indicating whether it is a graph bridge, using NetworkX outputs as ground truth.
      data: Unique synthetic graphs come from mixtures of ER, stochastic-block, power-law-cluster, BA, and dual-BA generators; the bridge task omits Newman-Watts-Strogatz. Generator mixture differs across easy, medium, and hard train/test settings.

      task: Predict a primary arXiv subject area for the approximately 1.5 million labeled arXiv papers while using the full 111-million-node citation network. Accuracy over 172 classes is the official measure.
      data: Nodes are papers indexed by Microsoft Academic Graph and directed edges are citations. Most nodes are not arXiv papers and have no class label, but remain available as unlabeled graph context.

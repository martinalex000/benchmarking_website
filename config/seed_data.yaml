    detailed_description:
      task: Predict a binary membership label for each node in a maximum clique selected by the reference solution procedure.
      data: Unique synthetic graphs are generated from ER, stochastic-block, power-law-cluster, Newman-Watts-Strogatz, BA, and dual-BA families. Easy, medium, and hard settings alter which generators appear in training and evaluation.
      features: GraphBench supplies no task-specific node features for maximum clique; topology is the input and the node labels encode one selected optimum clique.
      splits_and_evaluation: Each difficulty uses one million 16-node training graphs, 10,000 validation graphs, and 10,000 128-node test graphs. Node accuracy and F1 are reported.
      quirks_and_pitfalls: A graph can have several equally large cliques, while binary labels represent only one reference optimum; a different valid optimum can therefore be penalized. Positive-node imbalance and the joint size/distribution shift make accuracy alone insufficient.

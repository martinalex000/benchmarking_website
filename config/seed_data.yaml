      required terminals and edge attributes provide weights. Evaluated by F1.
    detailed_description:
      task: Predict a binary label for each edge indicating membership in the reference Steiner tree that connects the designated terminal nodes.
      data: Unique weighted synthetic graphs are sampled from six standard random-graph generators. Easy, medium, and hard settings vary the train/test generator mixtures, with training on 16-node graphs and evaluation on 128-node graphs.
      features: Node features designate the required terminals and edge attributes provide weights. These inputs distinguish Steiner tree from an unweighted connectivity task.
      splits_and_evaluation: Each difficulty contains one million training graphs plus 10,000 validation and 10,000 test graphs under a fixed 98/1/1 split. Edge accuracy and F1 are reported.
      quirks_and_pitfalls: This is edge classification, not node prediction. Steiner tree is NP-hard and the NetworkX routine is an approximation, so labels encode the reference heuristic rather than certified global optima. Equivalent or better trees can receive poor exact-edge scores.

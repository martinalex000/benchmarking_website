- name: HSG-12M
  arxiv_id: '2506.08618'
  url: https://arxiv.org/abs/2506.08618
  description: 'HSG-12M — a large-scale benchmark of Heterogeneous Spatial Graphs
    from real-world geospatial infrastructure data (transport, utilities, land-use).

    '
  datasets:
  - name: HSG-12M
    task_type: graph_classification
    detailed_description:
      task: >-
        Classify each Hamiltonian spectral graph into one of 1,401 characteristic-
        polynomial classes. This is graph-level classification scored by top-1 accuracy.
      data: >-
        Poly2Graph converts complex energy-band spectra of one-dimensional non-Hermitian
        crystal Hamiltonians into 11,601,681 static spatial multigraphs. Parallel curved
        trajectories between the same endpoints are retained as distinct edges.
      features: >-
        The provided featurization includes multi-edge geometry such as curve length,
        endpoint distance, midpoint, average spectral potential, and density of states.
        The raw release also supports custom featurization.
      splits_and_evaluation: >-
        The official stratified random split is 80/10/10 and preserves class proportions.
        Results are averaged over three seeds; the paper reports top-1 and top-10 accuracy.
      quirks_and_pitfalls: >-
        Collapsing parallel edges destroys information by design. Coefficients within a
        class can generate deformed but related spectra, so a random split tests recognition
        within the generated class distribution rather than transfer to unseen polynomials.
    sources:
    - title: HSG-12M benchmark
      arxiv_id: '2506.08618'
      kind: benchmark_or_upstream_source
    description: >-
      **1,401-class graph classification** Classify each Hamiltonian spectral graph into one of 1,401
      characteristic-polynomial classes. Parallel spectral trajectories remain distinct edges.
      Evaluated by Accuracy.
    primary_metric: Accuracy
    higher_is_better: true
    domain: physics
    variants:
    - name: Standard split
      is_standard: true
    num_graphs: 11601681
    num_classes: 1401
  - name: HSG-topology
    task_type: graph_classification
    detailed_description:
      task: >-
        Classify each topology-deduplicated Hamiltonian spectral graph into one of 1,401
        characteristic-polynomial classes.
      data: >-
        HSG-topology retains one representative of every graph-isomorphism class within
        each polynomial class, leaving 1,812,325 spatial multigraphs with a largest-to-
        smallest class-size ratio of 660.2.
      features: >-
        The variant is designed around unique connectivity patterns. Spatial multi-edge
        information remains available in the HSG representation, but topology-only models
        can deliberately omit it for the combinatorial experiment.
      splits_and_evaluation: >-
        The official stratified random split is 80/10/10 and evaluation reports accuracy
        averaged over three seeds.
      quirks_and_pitfalls: >-
        This is the only deliberately imbalanced HSG static variant. Plain accuracy is
        dominated by large classes; balanced metrics are useful diagnostics but are not the
        published headline. Isomorphism filtering must be performed within each class.
    sources:
    - title: HSG-12M benchmark
      arxiv_id: '2506.08618'
      kind: benchmark_or_upstream_source
    description: >-
      **1,401-class graph classification** Classify each topology-deduplicated Hamiltonian spectral
      graph into one of 1,401 characteristic-polynomial classes. The variant is designed around unique
      connectivity patterns. Evaluated by Accuracy.
    primary_metric: Accuracy
    higher_is_better: true
    domain: physics
    variants:
    - name: Standard split
      is_standard: true
    num_graphs: 1812325
    num_classes: 1401
- name: DualEquiNet RNA Benchmarks
  arxiv_id: '2506.19862'
  url: https://arxiv.org/abs/2506.19862
  description: 'RNA 3D structure prediction benchmarks used in DualEquiNet (equivariant
    graph network for biological molecule geometry). Includes ribosome and synthetic
    RNA datasets.

    '
  datasets:
  - name: COVID
    task_type: node_regression
    detailed_description:
      task: >-
        Predict three nucleotide-level experimental signals: reactivity, degradation at
        pH 10, and degradation with magnesium at pH 10. RMSE is lower-is-better.
      data: >-
        OpenVaccine contributes 4,082 synthetic RNA sequences of length 107--130. The
        benchmark filters sequences with signal-to-noise ratio below one and predicts 3D
        structures with RhoFold; those coordinates are not experimental structures.
      features: >-
        RNA samples include nucleotide identity, predicted or experimental 3D atomic coordinates as specified by the dataset, and task-specific scalar targets. Euclidean cutoff edges and spherical-harmonic neighborhoods are model construction, not additional measurements.
      splits_and_evaluation: >-
        DualEquiNet uses five independent random 80/10/10 train/validation/test splits,
        selects by validation performance, and reports test RMSE.
      quirks_and_pitfalls: >-
        Predicted structures must not be described as experimental ground truth. Random sequence splits can place close motifs in train and test, circular angles require periodic losses, and experimental targets have assay-specific noise and missingness.
    sources:
    - title: DualEquiNet RNA Benchmarks benchmark
      arxiv_id: '2506.19862'
      kind: benchmark_or_upstream_source
    description: >-
      **3-target nucleotide regression** Predict three nucleotide-level experimental signals:
      reactivity, degradation at pH 10, and degradation with magnesium at pH 10. Evaluated by RMSE.
    primary_metric: RMSE
    higher_is_better: false
    domain: biology
    variants:
    - name: Standard split
      is_standard: true
    num_graphs: 4082
  - name: Ribonanza
    task_type: node_regression
    description: >-
      **2-target nucleotide regression** Predict two continuous reactivity values for each nucleotide,
      one measured with dimethyl sulfate (DMS) and one with 2-aminopyridine-3-carboxylic acid
      imidazolide (2A3). Evaluated by RMSE.
    detailed_description:
      task: Predict two continuous reactivity values for each nucleotide, one measured with dimethyl sulfate (DMS) and one with 2-aminopyridine-3-carboxylic acid imidazolide (2A3). These chemical-mapping measurements probe nucleotide accessibility and flexibility and are evaluated with root mean squared error.
      data: Ribonanza-2k contains 2,260 RNA sequences of about 177 nucleotides. It is a benchmark subset derived from the much larger Ribonanza collection of chemical-mapping measurements produced through Eterna and related crowdsourcing efforts, not the complete collection of roughly two million measured sequences.
      features: In the DualEquiNet benchmark, each RNA sequence is supplied with an atom-level 3D structure predicted by RhoFold, and the models use geometric information including the RNA pseudotorsional backbone. The benchmark paper does not fully enumerate the released scalar feature encoding or document how the 2,260 sequences were selected from the upstream collection.
      splits_and_evaluation: DualEquiNet evaluates five independent random 80%/10%/10% train/validation/test splits, selects hyperparameters on validation performance, and reports RMSE for DMS, 2A3, and their average. These results should not be mixed with the original Kaggle competition protocol or models trained on the full Ribonanza collection.
      quirks_and_pitfalls: The benchmark combines experimental reactivity labels with predicted, rather than experimentally resolved, 3D structures, so structure-prediction error is part of the input pipeline. Chemical-probing profiles can be missing or low quality in the upstream data. The subset-selection and feature-generation details are insufficiently documented in the benchmark paper and require the exact released artifacts for reproducibility.
    sources:
    - title: DualEquiNet
      arxiv_id: '2506.19862'
      kind: benchmark_definition
    - title: Ribonanza, deep learning of RNA structure through dual crowdsourcing
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10925082/
      kind: upstream_data_source
    - title: RibonanzaNet reference implementation
      url: https://github.com/Shujun-He/RibonanzaNet
      kind: upstream_implementation
    primary_metric: RMSE
    higher_is_better: false
    domain: biology

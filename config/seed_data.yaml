    task_type: node_classification
    description: >-
      **349-class node classification** Predict the conference or journal of each paper using paper
      content, citations, authors, affiliations, and fields of study. Evaluated by Accuracy.
    detailed_description:
      task: Predict the conference or journal of each paper using paper content, citations, authors, affiliations, and fields of study. It is a 349-class paper-node classification task scored by accuracy.
      data: The heterogeneous graph has paper, author, institution, and field-of-study nodes, connected by writes, affiliation, citation, and topic relations. It contains 736,389 papers within 1,939,743 total entities.
      features: Only paper nodes receive standard input features, each a 128-dimensional average word2vec representation of title and abstract. Other entity types must obtain representations from identifiers or graph structure rather than supplied content features.
      splits_and_evaluation: Papers published before 2018 train the model, 2018 papers validate it, and papers from 2019 onward form test. The complete heterogeneous topology is present in the transductive graph.
      quirks_and_pitfalls: Venue labels in MAG can be noisy or missing, and the graph snapshot is no longer a live reflection of the scholarly record. Collapsing relation or node types changes the benchmark. Methods using additional author, venue, or text metadata must distinguish it from the standard inputs.

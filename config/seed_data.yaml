    '
  datasets:
  - name: SSSP
    task_type: node_regression
    short_description: >-
      Predict every node’s shortest-path distance from a marked source on synthetic graphs.
    detailed_description:
      task: >-
        Single Source Shortest Path prediction on synthetic graphs (node-level distances). The primary catalog metric is MSE.
      data: >-
        The release has 7,040 synthetic graphs with 25--35 nodes sampled from multiple
        graph generators: 5,120 train, 640 validation, and 1,280 test graphs.
      features: >-
        Synthetic graphs provide task-specific structural inputs such as a designated source. Targets are numeric node quantities computed by the reference algorithm; positional encodings or extra structural features are model additions.
      splits_and_evaluation: >-
        The fixed split is 5,120/640/1,280 graphs. The paper selects models by validation
        MSE and reports mean log10(MSE) over 20 runs; lower is better.
      quirks_and_pitfalls: >-
        Targets are deterministic functions of generated topology, so generator overlap and size range determine difficulty. Random splits test interpolation; claims about algorithmic generalization require held-out sizes or graph families.

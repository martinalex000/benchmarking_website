  - name: TU Dortmund
    arxiv_id: null
    url: "https://chrsmrrs.github.io/datasets/"
    description: TU Dortmund graph kernel benchmark datasets for graph classification.
    datasets:

      - name: MUTAG
        task_type: graph_classification
        description: Graph classification of mutagenic aromatic and heteroaromatic nitro compounds (2 classes).
        primary_metric: Accuracy
        higher_is_better: true
        domain: chemistry
        pyg_url: "https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.TUDataset.html"
        variants:
          - name: 10-fold CV
            is_standard: true

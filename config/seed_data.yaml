    task_type: link_prediction
    description: >-
      **Link prediction** For each 2019 source paper, rank a withheld true reference above 1,000
      older, uncited candidate papers. Papers have 128-dimensional averages of skip-gram embeddings
      from their titles and abstracts. Evaluated by MRR.
    detailed_description:
      task: For each 2019 source paper, rank a withheld true reference above 1,000 older, uncited candidate papers. Mean reciprocal rank is averaged over the source-paper queries.
      data: The directed MAG subset contains 2,927,963 papers and 30,561,187 citation edges. Each node has its publication year and citations point from the citing paper to the referenced paper.
      features: Papers have 128-dimensional averages of skip-gram embeddings from their titles and abstracts. Candidate negatives are restricted to previous papers not already cited by the source.
      splits_and_evaluation: Two references are randomly removed from each eligible 2019 source paper, one for validation and one for test; all remaining citations train the model. Evaluation ranks each held-out target separately against its fixed negative candidates.
      quirks_and_pitfalls: The deprecated ogbl-citation dataset had faulty negative sampling and must not be combined with ogbl-citation2. Sampled MRR is not full-corpus retrieval, and sampled uncited papers are not necessarily irrelevant. Edge direction and temporal eligibility are essential to the protocol.

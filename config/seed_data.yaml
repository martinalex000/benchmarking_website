      splits_and_evaluation: Each difficulty provides one million 16-node training graphs plus 10,000 validation and 10,000 128-node test graphs. Graph-level MAE is the metric under the fixed 98/1/1 split.
      quirks_and_pitfalls: GraphBench omits flow from its 128-to-512-node size study because target magnitude, and therefore raw MAE, scales with network size. Capacity distribution and generator shift must be held fixed when comparing errors.

- name: Heterophilic Graphs
  arxiv_id: '2110.14446'
  url: https://arxiv.org/abs/2110.14446
  source_papers:
  - arxiv_id: '2002.05287'
    url: https://arxiv.org/abs/2002.05287
    role: Original six-dataset benchmark (Geom-GCN)
  - arxiv_id: '2110.14446'
    url: https://arxiv.org/abs/2110.14446
    role: Large-scale heterophily benchmark context (LINKX)
  is_legacy: true
  description: Legacy heterophilic node classification benchmarks with known evaluation
    problems (WebKB, Wikipedia, and the five-class Actor graph).
  datasets:
  - name: Texas
    task_type: node_classification
    description: >-
      **5-class node classification** Classify each webpage as student, project, course, staff, or
      faculty using the page text and hyperlink graph. Uses the Geom-GCN/PyG node features and graph.
      Evaluated by Accuracy.
    detailed_description:
      task: Classify each webpage as student, project, course, staff, or faculty using the page text and hyperlink graph. This is transductive node classification on one university-specific subgraph of WebKB.
      data: Nodes are webpages collected from the University of Texas computer-science department and edges are hyperlinks between pages. The Geom-GCN/PyG processing used in graph-learning papers contains 183 nodes; it is only one processed subset of the broader seven-class, multi-university WebKB collection.
      features: Each node has a 1,703-dimensional bag-of-words representation of its webpage content. The graph structure records hyperlinks rather than text similarity.
      splits_and_evaluation: The standard graph-learning protocol uses the 10 fixed Geom-GCN train/validation/test splits and reports mean accuracy across them. Results from newly generated splits or from the larger WebKB/WebKB4 collections are not directly comparable.
      quirks_and_pitfalls: >-
        Texas is extremely small and severely class-imbalanced: one of its five classes contains only one node. Accuracy can therefore conceal poor minority-class behavior, and results have high variance across splits. The names WebKB, WebKB4, 4 Universities, and Texas refer to related but different selections and label sets, so the exact processed artifact must be stated.
    sources:
    - title: CMU Text Learning WebKB dataset description
      url: https://www.cs.cmu.edu/~TextLearning/datasets.html
      kind: upstream_data_source
    - title: PyTorch Geometric WebKB documentation

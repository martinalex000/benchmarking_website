      data: >-
        Binary classification — blood-brain barrier permeability of molecules.
      features: >-
        MoleculeNet distributes SMILES and targets, not one mandatory graph featurization. A graph implementation normally derives atom and bond fields with RDKit or DeepChem; results depend on featurizer, salt handling, stereochemistry, and invalid-molecule policy.

    higher_is_better: true
    domain: web
    pyg_url: https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.WebKB.html
    variants:
    - name: Standard split
      is_standard: true
      notes: Geom-GCN 10 fixed splits; results typically averaged.

benchmarks:
- name: LRGB
  arxiv_id: '2206.08164'
  url: https://arxiv.org/abs/2206.08164
  description: 'Long Range Graph Benchmark — five graph ML tasks designed to test
    long-range dependency modelling. Introduced by Dwivedi et al. (2022).

    '
  datasets:
  - name: Peptides-func
    task_type: graph_classification
    description: Multi-label graph classification on peptide molecules (10 classes).
    primary_metric: AP
    higher_is_better: true
    domain: chemistry
    pyg_url: https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.LRGBDataset.html
    variants:
    - name: Standard split
      is_standard: true
  - name: Peptides-struct
    task_type: graph_regression
    description: Multi-task graph regression on peptide structural properties (11
      targets).
    primary_metric: MAE
    higher_is_better: false
    domain: chemistry
    pyg_url: https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.LRGBDataset.html
    variants:
    - name: Standard split
      is_standard: true
  - name: PascalVOC-SP
    task_type: node_classification
    description: Node classification on superpixel graphs derived from PascalVOC 2011.
    primary_metric: F1
    higher_is_better: true
    domain: computer_vision
    pyg_url: https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.LRGBDataset.html
    variants:
    - name: Standard split
      is_standard: true
  - name: COCO-SP
    task_type: node_classification
    description: Node classification on superpixel graphs derived from MS-COCO.
    primary_metric: F1
    higher_is_better: true
    domain: computer_vision
    pyg_url: https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.LRGBDataset.html
    variants:
    - name: Standard split
      is_standard: true
  - name: PCQM-Contact
    task_type: link_prediction
    description: Link prediction of spatial atom contacts in quantum chemistry molecules.
    primary_metric: MRR
    higher_is_better: true
    domain: chemistry
    pyg_url: https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.LRGBDataset.html
    variants:
    - name: Standard split
      is_standard: true
- name: GraphBench
  arxiv_id: '2512.04475'
  url: https://arxiv.org/abs/2512.04475
  description: 'GraphBench — a comprehensive graph learning benchmark covering diverse
    graph types and tasks spanning social networks, hardware design, logic, earth
    systems, and algorithmic reasoning.

    '
  datasets:
  - name: BlueSky
    task_type: node_classification
    description: 'Dynamic directed graphs of Bluesky social network user interactions.
      Node-level task: predict future engagement from past interactions and text embeddings.

      '
    primary_metric: MAE
    higher_is_better: false
    domain: social
    pyg_url: https://graphbench.github.io/website/datasets.html
    num_graphs: 3
    avg_nodes: 433000.0
    avg_edges: 10000000.0
    variants:
    - name: Standard split
      is_standard: true
  - name: Chip Design
    task_type: graph_generation
    description: 'Learning to generate small Boolean circuits (and-inverter graphs,
      AIGs). Generation task: produce functionally equivalent, optimised circuits.

      '
    primary_metric: Accuracy
    higher_is_better: true
    domain: hardware
    pyg_url: https://graphbench.github.io/website/datasets.html
    variants:
    - name: Standard split
      is_standard: true
  - name: Electronic Circuits
    task_type: graph_classification
    description: 'Analog circuit topology design. Graph-level task: predict 2 continuous
      performance metrics from graph structure across 3 circuit-size datasets.

      '
    primary_metric: MAE
    higher_is_better: false
    domain: hardware
    pyg_url: https://graphbench.github.io/website/datasets.html
    num_graphs: 93000
    avg_nodes: 18.5
    avg_edges: 43.0
    variants:
    - name: Standard split
      is_standard: true
  - name: SAT Solving
    task_type: node_classification
    description: 'SAT problem instances represented as graphs. Multi-level node/edge/graph-level
      tasks across 11 solvers and 3 instance-size scales.

      '
    primary_metric: Accuracy
    higher_is_better: true
    domain: algorithms
    pyg_url: https://graphbench.github.io/website/datasets.html

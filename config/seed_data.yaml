benchmarks:
- name: LRGB
  arxiv_id: '2206.08164'
  url: https://arxiv.org/abs/2206.08164
  description: 'Long Range Graph Benchmark — five graph ML tasks designed to test
    long-range dependency modelling. Introduced by Dwivedi et al. (2022).

    '
  datasets:
  - name: Peptides-func
    task_type: graph_classification
    description: >-
      **10-dimensional multi-label classification** on molecular graphs without hydrogens.
      Predict a binary label per peptide function (antibacterial, antiviral, cell-cell
      communication, antifungal, anticancer, etc.) from OGB features. Positive rates span
      1.9%–62.7%; evaluated by AP.
    detailed_description:
      task: Predict all applicable therapeutic-function labels for each peptide. A peptide may have several of the 10 labels, so this is graph-level multi-label classification evaluated with the unweighted mean average precision across labels.
      data: The benchmark contains 15,535 peptides selected from SATPdb, which itself aggregates and manually curates peptide records from 22 source databases. Each peptide is represented as a molecular graph whose nodes are non-hydrogen atoms and whose edges are covalent bonds.
      features: >-
        The graphs reuse OGB molecular featurization computed from SMILES: each atom has nine categorical feature fields and each bond has three. The benchmark deliberately omits peptide 2D folding and 3D conformation; its graph describes covalent connectivity rather than the peptide's folded spatial structure.
      splits_and_evaluation: The fixed split is 70% training, 15% validation, and 15% test. It is stratified by the complete 10-label combination, with combinations occurring fewer than 10 times pooled into one meta-class. The labels are strongly imbalanced, which is why average precision rather than accuracy is the primary metric.
      quirks_and_pitfalls: The 10 labels are correlated and non-exclusive; treating the task as single-label classification is incorrect. SATPdb combines records from many upstream databases, and many peptides have multiple functions. Randomly resplitting the data or adding predicted structural information changes the published LRGB protocol. The benchmark's long atom-level chains should not be mistaken for experimentally determined peptide conformations.
    sources:
    - title: Long Range Graph Benchmark
      arxiv_id: '2206.08164'
      kind: benchmark_definition
    - title: SATPdb, a database of structurally annotated therapeutic peptides
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4702810/
      kind: upstream_data_source
    primary_metric: AP
    higher_is_better: true
    domain: chemistry
    pyg_url: https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.LRGBDataset.html
    num_graphs: 15535
    avg_nodes: 150.94
    avg_edges: 307.30
    num_classes: 10
    variants:
    - name: Standard split
      is_standard: true
  - name: Peptides-struct
    task_type: graph_regression
    description: >-
      **11-target graph regression** Predict 11 graph-level geometric descriptors computed from each
      peptide's 3D structure. Inputs use OGB's nine categorical atom fields and three categorical bond
      fields derived from SMILES. Evaluated by MAE.
    detailed_description:
      task: Predict 11 graph-level geometric descriptors computed from each peptide's 3D structure. The targets cover three mass-weighted inertias, three valence-weighted inertias, three principal-axis lengths, sphericity, and distance from a best-fit plane; each target is standardized to zero mean and unit variance.
      data: The 15,535 peptides are the same SATPdb-derived molecules used by Peptides-func. Nodes are non-hydrogen atoms and edges are covalent bonds, giving much larger molecular graphs than typical small-molecule benchmarks.
      features: Inputs use OGB's nine categorical atom fields and three categorical bond fields derived from SMILES. Although the targets were computed from 3D peptide structures, neither coordinates nor other 2D/3D structural information are included in the input graphs.
      splits_and_evaluation: Peptides-struct uses the same fixed 70%/15%/15% stratified split as Peptides-func, where stratification is based on pooled combinations of the functional labels. The primary score is the unweighted mean absolute error across the 11 standardized targets; per-target R-squared is supplementary.
      quirks_and_pitfalls: The task asks a model to infer global 3D properties from covalent connectivity without a supplied conformation. Target standardization is part of the benchmark, so MAE on unstandardized physical quantities is not comparable. The split is stratified by function rather than structural scaffold, and correlated geometric targets must not be treated as independent datasets.
    sources:
    - title: Long Range Graph Benchmark
      arxiv_id: '2206.08164'
      kind: benchmark_definition
    - title: SATPdb, a database of structurally annotated therapeutic peptides
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4702810/
      kind: upstream_data_source
    primary_metric: MAE
    higher_is_better: false
    domain: chemistry
    pyg_url: https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.LRGBDataset.html
    num_graphs: 15535
    avg_nodes: 150.94
    avg_edges: 307.30
    num_classes: 11
    variants:
    - name: Standard split
      is_standard: true
  - name: PascalVOC-SP
    task_type: node_classification
    description: >-
      **21-class node classification** Assign one of 21 semantic-segmentation labels, including
      background, to every superpixel node. Evaluated by F1.
    detailed_description:
      task: Assign one of 21 semantic-segmentation labels, including background, to every superpixel node. A superpixel receives the ground-truth class of the pixel at the superpixel's center-of-mass coordinate.
      data: Each of 11,355 images from the Semantic Boundaries Dataset augmentation of Pascal VOC 2011 becomes one graph. SLIC with compactness 30 produces at most 500 image regions, and two regions are connected when they share a boundary in the default region-adjacency graph.
      features: Each node has 12 RGB summary values—the mean, standard deviation, maximum, and minimum in each channel—plus its two-dimensional center-of-mass coordinate. Each edge stores the average Sobel response and pixel count along the shared boundary.
      splits_and_evaluation: The original training set remains training data. The original validation set is divided equally into validation and test subsets using a stratified image-level meta-label obtained by majority vote over non-background node labels, yielding 8,498/1,428/1,429 graphs. The score is class-weighted macro F1 over nodes.
      quirks_and_pitfalls: This is not pixel-level segmentation; labels and predictions are quantized to superpixels, and labeling only from the center pixel can misrepresent mixed regions. LRGB also releases compactness-10 and 8-nearest-neighbor graph variants, whose structures and edge features differ from the default compactness-30 region-boundary version.
    sources:
    - title: Long Range Graph Benchmark
      arxiv_id: '2206.08164'
      kind: benchmark_definition
    - title: The PASCAL Visual Object Classes Challenge
      url: http://host.robots.ox.ac.uk/pascal/VOC/pubs/everingham10.pdf
      kind: upstream_data_source
    primary_metric: F1
    higher_is_better: true
    domain: computer_vision
    pyg_url: https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.LRGBDataset.html
    num_graphs: 11355
    avg_nodes: 479.40
    avg_edges: 2710.48
    num_classes: 21
    variants:
    - name: Standard split
      is_standard: true
  - name: COCO-SP
    task_type: node_classification
    description: >-
      **81-class node classification** Predict one of 81 semantic labels for each superpixel node.
      Nodes contain 12 per-region RGB statistics—mean, standard deviation, maximum, and minimum per
      channel—and two center-of-mass coordinates. Evaluated by F1.
    detailed_description:
      task: Predict one of 81 semantic labels for each superpixel node. The assigned target is the pixel annotation at the mean coordinate of the superpixel region.
      data: The benchmark converts 123,286 MS COCO images into graphs. Its default construction uses SLIC superpixels with compactness 30 and at most 500 regions per image, joined by edges when the regions share a boundary.
      features: Nodes contain 12 per-region RGB statistics—mean, standard deviation, maximum, and minimum per channel—and two center-of-mass coordinates. Region-boundary edges contain the mean Sobel response and the number of boundary pixels.
      splits_and_evaluation: The original COCO validation set becomes a 5,000-image test set; 5,000 images sampled from the original training set form validation, leaving 113,286 for training. The official score is class-weighted macro F1 over superpixel nodes.
      quirks_and_pitfalls: The task differs from original COCO instance segmentation and inherits approximation error from superpixelization and center-pixel labels. Optional LRGB variants change SLIC compactness or replace region-boundary edges with coordinate- or feature-based 8-nearest-neighbor graphs; results across these graph constructions are not directly comparable.
    sources:
    - title: Long Range Graph Benchmark
      arxiv_id: '2206.08164'
      kind: benchmark_definition
    - title: Microsoft COCO, Common Objects in Context
      arxiv_id: '1405.0312'
      kind: upstream_data_source
    primary_metric: F1
    higher_is_better: true
    domain: computer_vision
    pyg_url: https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.LRGBDataset.html
    num_graphs: 123286
    avg_nodes: 476.88
    avg_edges: 2693.67
    num_classes: 81
    variants:
    - name: Standard split
      is_standard: true
  - name: PCQM-Contact
    task_type: link_prediction
    description: >-
      **Long-range link prediction** Rank atom pairs that are more than five covalent-bond hops apart
      but less than 3.5 angstrom apart in the molecule's computed 3D geometry. Only atom pairs
      separated by more than five covalent hops are candidates. Evaluated by MRR.
    detailed_description:
      task: Rank atom pairs that are more than five covalent-bond hops apart but less than 3.5 angstrom apart in the molecule's computed 3D geometry. The benchmark frames this contact-map problem as link prediction on previously unseen molecules.
      data: The 529,434 molecules come from PCQM4Mv2 training molecules with available 3D structures and at least one qualifying contact. Unlike most molecular graph benchmarks, hydrogen atoms are explicit nodes because hydrogen bonding is relevant to the contact target.
      features: Inputs are 2D covalent graphs using the OGB nine-field atom encoder and three-field bond encoder. The 3D coordinates determine labels but are not input features, and the predicted contact itself has no edge type.
      splits_and_evaluation: >-
        Molecules are randomly divided 90%/5%/5% into 476,490 training, 26,472 validation, and 26,472 test graphs. Evaluation uses filtered MRR and Hits@1/3: when ranking a true contact, other known true contacts for the query atom are masked rather than counted as negatives.
      quirks_and_pitfalls: Training supplies positive contacts without authoritative hard-negative labels; an unobserved pair is not necessarily a chemically meaningful negative. The random molecule split does not enforce scaffold separation. Results depend on filtered ranking and explicit hydrogens, and therefore are not comparable to generic binary link prediction or PCQM4Mv2 HOMO-LUMO regression.
    sources:
    - title: Long Range Graph Benchmark
      arxiv_id: '2206.08164'
      kind: benchmark_definition
    - title: OGB-LSC, A Large-Scale Challenge for Machine Learning on Graphs
      arxiv_id: '2103.09430'
      kind: upstream_data_source
    primary_metric: MRR
    higher_is_better: true
    domain: chemistry
    pyg_url: https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.LRGBDataset.html
    num_graphs: 529434
    avg_nodes: 30.14
    avg_edges: 61.09
    num_classes: 1
    variants:
    - name: Standard split
      is_standard: true
- name: GraphBench
  arxiv_id: '2512.04475'
  url: https://arxiv.org/abs/2512.04475
  description: 'GraphBench — a comprehensive graph learning benchmark covering diverse
    graph types and tasks spanning social networks, hardware design, logic, earth
    systems, and algorithmic reasoning.

    '
  datasets:
  - name: BlueSky
    task_type: node_regression
    description: >-
      **Node regression** Predict each user's median likes, replies, and reposts on future posts using
      earlier posts and interactions. User features aggregate modern language-model embeddings of
      posts written before the prediction cutoff. Evaluated by MAE.
    detailed_description:
      task: Predict each user's median likes, replies, and reposts on future posts using earlier posts and interactions. GraphBench reports MAE, R-squared, and Spearman correlation for separate quote-, reply-, and repost-edge graphs.
      data: Users are nodes and a directed timestamped edge records that one user quoted, replied to, or reposted another user's post. The benchmark derives these graphs from the public Bluesky collection curated by Failla and colleagues.
      features: User features aggregate modern language-model embeddings of posts written before the prediction cutoff. Targets aggregate engagement received on posts after that cutoff.
      splits_and_evaluation: Four consecutive periods contain 55%, 15%, 15%, and 15% of posts. Training observes the first 55% and predicts the next 15%; validation and test advance the target window while accumulating interaction history from the collection start.
      quirks_and_pitfalls: Users, content, and graph density change over time, so the task includes temporal and structural shift. Engagement is heavy-tailed and affected by seasonality and platform dynamics outside the graph. Source records may be updated for user erasure, so dataset versions may differ.
    sources:
    - title: GraphBench
      arxiv_id: '2512.04475'
      kind: benchmark_definition
    - title: Bluesky dataset
      url: https://zenodo.org/records/11082879
      kind: upstream_data_source
    primary_metric: MAE
    higher_is_better: false
    domain: social
    pyg_url: https://graphbench.github.io/website/datasets.html
    num_graphs: 3
    avg_nodes: 433000.0
    avg_edges: 10000000.0
    variants:
    - name: Standard split
      is_standard: true
  - name: Chip Design
    task_type: graph_generation
    description: >-
      **Graph generation** Generate a structurally efficient and-inverter graph implementing a
      supplied Boolean function while preserving the exact truth table. Evaluated by Accuracy.
    detailed_description:
      task: Generate a structurally efficient and-inverter graph implementing a supplied Boolean function while preserving the exact truth table. Quality must account for functional equivalence as well as circuit size or synthesis cost.
      data: Samples are small directed acyclic logic circuits represented as and-inverter graphs. The benchmark uses functions and circuits produced with established logic-synthesis tooling rather than analog measurements.
      features: Nodes denote primary inputs or logic gates and directed edges carry signals; complemented edges encode inversion in the AIG representation. The Boolean function is the conditioning target for generation.
      splits_and_evaluation: GraphBench provides a fixed benchmark protocol and compares generated circuits with non-learning synthesis baselines. Exact equivalence checking is required; a visually or structurally similar graph is not sufficient.
      quirks_and_pitfalls: Circuit minimization is NP-hard and many non-isomorphic circuits implement the same function, so supervised graph matching is not a complete quality measure. Generated DAG validity, truth-table equivalence, and optimization quality are distinct requirements. The benchmark paper reports no successful learned baseline for this task.
    sources:
    - title: GraphBench
      arxiv_id: '2512.04475'
      kind: benchmark_definition
    - title: ABC, An Academic Industrial-Strength Verification Tool
      url: https://people.eecs.berkeley.edu/~alanmi/publications/2007/cav07_abc.pdf
      kind: synthesis_tool
    primary_metric: Accuracy
    higher_is_better: true
    domain: hardware
    pyg_url: https://graphbench.github.io/website/datasets.html
    variants:
    - name: Standard split
      is_standard: true
  - name: Electronic Circuits
    task_type: graph_regression
    description: >-
      **Graph regression** Regress voltage conversion ratio and power conversion efficiency for a
      switched power-converter topology. Nodes represent capacitors, inductors, two phase-specific
      switch types, input, output, and ground. Evaluated by MAE.
    detailed_description:
      task: Regress voltage conversion ratio and power conversion efficiency for a switched power-converter topology. Each target is evaluated separately with relative squared error.
      data: Random valid, non-isomorphic converter topologies contain 5, 7, or 10 internal components and three terminal ports. NGSPICE simulations supply targets; circuits that fail simulation are discarded.
      features: Nodes represent capacitors, inductors, two phase-specific switch types, input, output, and ground. Electrical connections are edges, and fixed component/operating parameters define the simulated circuit conditions.
      splits_and_evaluation: The three component counts are distinct complexity datasets with fixed GraphBench splits. Evaluation uses simulation-derived ground truth under the stated fixed capacitance, inductance, voltage, frequency, and load settings.
      quirks_and_pitfalls: Discarding invalid simulations conditions the dataset on simulator success. Larger topology spaces have proportionally less coverage, and predictions apply only to the fixed operating parameters. The original YAML incorrectly called this classification; it is two-target graph regression.
    sources:
    - title: GraphBench
      arxiv_id: '2512.04475'
      kind: benchmark_definition
    - title: Graph Learning for Design of High-Performance Switching Converters
      url: https://openreview.net/forum?id=GN3kExw2DB
      kind: construction_source
    primary_metric: MAE
    higher_is_better: false
    domain: hardware
    pyg_url: https://graphbench.github.io/website/datasets.html
    num_graphs: 93000
    avg_nodes: 18.5
    avg_edges: 43.0
    variants:
    - name: Standard split
      is_standard: true
  - name: SAT Solving
    task_type: graph_classification
    description: >-
      **Joint solver-selection and runtime prediction** on SAT-instance graphs, selecting the fastest
      solver and regressing per-solver runtime. Evaluated by Accuracy.
    detailed_description:
      task: GraphBench defines graph-level algorithm selection, choosing the fastest SAT solver for an instance, and empirical performance prediction, regressing individual solver runtime. These are separate classification and regression targets over the same formulas.
      data: The collection combines SAT instances spanning several size regimes and records runtimes for multiple modern solvers. Formulas are available in literal-clause, variable-clause, and variable graph representations.
      features: Nodes and edges encode variables, literals, clauses, polarity, and incidence or co-occurrence according to the chosen graph construction. Solver runtimes and best-solver identities are graph-level targets.
      splits_and_evaluation: Fixed small, medium, and large configurations test both in-distribution performance and scale. Classification uses accuracy-like selection metrics; runtime prediction uses regression error as defined per solver.
      quirks_and_pitfalls: Solver runtime is noisy and affected by hardware, limits, random seeds, and censored timeouts. Different formula graph encodings are not interchangeable. Large instances are expensive enough that some solver-derived features and targets cannot be produced uniformly.
    sources:
    - title: GraphBench

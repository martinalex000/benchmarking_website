      task: Classify each edge according to whether it belongs to the NetworkX reference minimum spanning tree.
      data: Unique synthetic graphs are drawn from ER, stochastic-block, power-law-cluster, Newman-Watts-Strogatz, BA, and dual-BA generators. Difficulty changes the train-versus-test generator mixture; MST also uses shifted generator parameters because the original setting generalized too easily.
      features: Edge weights are provided as edge attributes. No general node features are supplied; models receive graph topology and the weighted edges needed to define the optimization problem.
      splits_and_evaluation: Each difficulty has one million 16-node training graphs and 10,000 validation and 10,000 test graphs with 128 nodes, a fixed 98/1/1 split. Report edge accuracy and F1; GraphBench emphasizes F1.
      quirks_and_pitfalls: The split changes size by eightfold and shifts generator mixture simultaneously. Multiple minimum spanning trees can exist when weights tie, so labels reflect the reference implementation's chosen solution. The optional tokenized edge representation is a model transform, not raw data.

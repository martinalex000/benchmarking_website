      is_standard: true
  - name: ER graph
    task_type: graph_regression
    description: >-
      **Graph regression** Predict an optimal combinatorial-objective value in the supervised
      protocol, or learn node scores decoded into feasible solutions in the unsupervised protocol.
      Graphs have no supplied node or edge features, so topology is the model input. Evaluated by MAE.
    detailed_description:
      task: Predict an optimal combinatorial-objective value in the supervised protocol, or learn node scores decoded into feasible solutions in the unsupervised protocol. The included problems are maximum independent set, max-cut, and graph coloring.
      data: Synthetic Erdős–Rényi graphs are sampled in small and large regimes by controlling node count and independent edge probability. GraphBench reports 50,000 instances per dataset.
      features: Graphs have no supplied node or edge features, so topology is the model input. Targets and surrogate losses are problem-specific rather than properties of the ER generator itself.
      splits_and_evaluation: The supervised benchmark reports MAE on optimum values obtained with conventional solvers. The unsupervised benchmark evaluates the objective value after a problem-specific decoder enforces feasibility.
      quirks_and_pitfalls: ER graph is a generator family, not a single graph-classification dataset. Density strongly controls difficulty, and comparisons are meaningful only when problem, scale, generator parameters, split, and learning protocol match.
    sources:
    - title: GraphBench
      arxiv_id: '2512.04475'
      kind: benchmark_definition
    - title: On Random Graphs I
      url: https://doi.org/10.5486/PMD.1959.6.3-4.290
      kind: generator_origin
    primary_metric: MAE
    higher_is_better: false
    domain: algorithms
    pyg_url: https://graphbench.github.io/website/datasets.html
    variants:
    - name: Standard split
      is_standard: true
  - name: RB graph
    task_type: graph_regression
    description: >-
      **Graph regression** Predict the optimal objective value for maximum independent set in the
      supervised setting, or train node scores with differentiable surrogates and
      feasibility-preserving decoders for maximum independent set, max-cut, and graph coloring.
      Evaluated by MAE.
    detailed_description:
      task: Predict the optimal objective value for maximum independent set in the supervised setting, or train node scores with differentiable surrogates and feasibility-preserving decoders for maximum independent set, max-cut, and graph coloring.
      data: RB-model instances contain n groups of k vertices and use a constraint-tightness parameter p; GraphBench rejection-samples to keep graph sizes in configured ranges and provides small and large variants with 50,000 instances per dataset.
      features: The graphs contain no node or edge attributes. Topology encodes the optimization instance and solver outputs supply supervised optimum-value labels where available.
      splits_and_evaluation: Supervised objective prediction is evaluated by MAE. In unsupervised runs, the decoded feasible solution is scored by its achieved objective rather than classification accuracy.
      quirks_and_pitfalls: RB means the RB random constraint graph model, not random bipartite graph. Its planted group structure and tuned hardness parameters differ materially from ER and BA; report the problem, size regime, and learning protocol.

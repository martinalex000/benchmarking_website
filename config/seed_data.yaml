- name: OGB
  arxiv_id: '2005.00687'
  url: https://arxiv.org/abs/2005.00687
  description: 'Open Graph Benchmark — large-scale standardised graph ML benchmarks
    covering graph-level, node-level, and link-level prediction across diverse domains.

    '
  datasets:
  - name: ogbg-molhiv
    task_type: graph_classification
    description: Binary prediction of HIV replication inhibition from molecular graphs, using MoleculeNet assay labels and a scaffold split.
    detailed_description:
      task: Predict whether a compound inhibits HIV replication. This is one binary graph-classification task scored by ROC-AUC because active compounds are rare.
      data: The 41,127 compounds are OGB's RDKit-processed version of the MoleculeNet HIV dataset. Each graph is one molecule, with atoms as nodes and covalent bonds as edges; the activity labels ultimately come from the Drug Therapeutics Program AIDS antiviral screen.
      features: OGB converts SMILES into nine categorical atom fields, including atomic number, chirality, formal charge, aromaticity, and ring membership, and three categorical bond fields describing bond type, stereochemistry, and conjugation.
      splits_and_evaluation: The official split separates compounds by Bemis-Murcko-style two-dimensional molecular scaffolds rather than assigning molecules independently at random. ROC-AUC is computed on the held-out scaffold groups.
      quirks_and_pitfalls: The assay is highly imbalanced and a random split is easier because close structural analogues can occur on both sides. The label reports activity in a particular screening pipeline, not clinical efficacy, binding mechanism, or general antiviral action. RDKit parsing and OGB feature versions should be held fixed for comparison.
    sources:
    - title: Open Graph Benchmark
      arxiv_id: '2005.00687'
      kind: benchmark_definition
    - title: OGB graph property prediction documentation
      url: https://ogb.stanford.edu/docs/graphprop/#ogbg-mol
      kind: official_documentation
    - title: MoleculeNet
      arxiv_id: '1703.00564'
      kind: upstream_benchmark
    primary_metric: ROC-AUC
    higher_is_better: true
    domain: chemistry
    pyg_url: https://ogb.stanford.edu/docs/leader_graphprop/#ogbg-molhiv
    num_graphs: 41127
    avg_nodes: 25.5
    avg_edges: 27.5
    num_classes: 2
    variants:
    - name: Standard split
      split_type: scaffold
      is_standard: true
      notes: OGB scaffold split; use the official default task and features.
  - name: ogbg-molpcba
    task_type: graph_classification
    description: Multi-task prediction of 128 PubChem bioassay outcomes from molecular graphs under a scaffold split.
    detailed_description:
      task: Predict activity separately for 128 PubChem BioAssay tasks. Labels are binary where measured, but many molecule-task pairs are unassayed and stored as missing rather than negative.
      data: OGB adopts 437,929 RDKit-processable compounds from MoleculeNet's PCBA collection. Graphs represent atoms and covalent bonds; assay outcomes originate from PubChem's heterogeneous high-throughput screening records.
      features: Inputs use the standard OGB nine-field categorical atom representation and three-field categorical bond representation generated from SMILES. Assay identifiers and labels are targets, not molecular input features.
      splits_and_evaluation: Molecules are separated by two-dimensional scaffold into the official train, validation, and test sets. Average precision is calculated for each evaluable assay and averaged across the 128 tasks, ignoring missing labels.
      quirks_and_pitfalls: Only about 1.4% of assigned labels are positive, so accuracy and unweighted treatment of missing labels are misleading. The assays measure different biological endpoints and have different coverage; a missing label means unknown, not inactive. Random splits and per-task metrics are not directly comparable to the official mean AP.
    sources:
    - title: Open Graph Benchmark
      arxiv_id: '2005.00687'
      kind: benchmark_definition
    - title: OGB graph property prediction documentation
      url: https://ogb.stanford.edu/docs/graphprop/#ogbg-mol
      kind: official_documentation
    - title: MoleculeNet
      arxiv_id: '1703.00564'
      kind: upstream_benchmark
    primary_metric: AP
    higher_is_better: true
    domain: chemistry
    pyg_url: https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.OGBDataset.html
    num_graphs: 437929
    avg_nodes: 26.0
    avg_edges: 28.1
    num_classes: 128
    variants:
    - name: Standard split
      split_type: scaffold
      is_standard: true
      notes: OGB scaffold split; AP is averaged across all 128 tasks.
  - name: ogbg-ppa
    task_type: graph_classification
    description: Classification of STRING protein-association neighborhoods into 37 broad taxonomic groups, with held-out species.
    detailed_description:
      task: Given a protein-association neighborhood, predict the broad taxonomic group of its source species. The output is one of 37 classes and is scored by accuracy.
      data: OGB samples 100 center proteins from each of 1,581 STRING species, extracts their two-hop association neighborhoods, removes the center, and subsamples graphs to fewer than 300 protein nodes. The resulting 158,100 graphs cover diverse branches of the tree of life.
      features: Nodes carry no intrinsic biological feature in the standard artifact. Each association edge has seven confidence values for evidence channels such as co-expression, gene neighborhood, co-occurrence, and gene fusion.
      splits_and_evaluation: Validation and test graphs come from species absent from training while remaining within the same 37 taxonomic groups. Accuracy therefore measures cross-species generalization rather than memorization of neighborhoods from the same organism.
      quirks_and_pitfalls: The target is the graph's taxonomic origin, not a protein function. STRING edges mix experimental and computational evidence, and the seven confidence channels can encode species-specific collection patterns. Random graph splits would leak species identity and materially change the task.
    sources:
    - title: Open Graph Benchmark
      arxiv_id: '2005.00687'
      kind: benchmark_definition
    - title: STRING v11
      url: https://doi.org/10.1093/nar/gky1131
      kind: upstream_data_source
    - title: Evolution of resilience in protein interactomes across the tree of life
      url: https://doi.org/10.1073/pnas.1818013116
      kind: construction_source
    primary_metric: Accuracy
    higher_is_better: true
    domain: biology
    pyg_url: https://ogb.stanford.edu/docs/graphprop/#ogbg-ppa
    num_graphs: 158100
    avg_nodes: 243.4
    avg_edges: 2266.1
    num_classes: 37
    variants:
    - name: Standard split
      split_type: species
      is_standard: true
      notes: OGB species split.
  - name: ogbg-code2
    task_type: graph_classification
    description: Method-name subtoken prediction from augmented abstract syntax trees of about 452,000 Python methods.
    detailed_description:
      task: Predict the subtokens in a Python method's name from the method body represented as an abstract syntax tree. The graph-level output is a sequence, but the official F1 score compares sets of predicted and reference subtokens and therefore does not reward the correct subtoken order.
      data: The 452,741 methods originate from CodeSearchNet and were extracted from 13,587 popular GitHub repositories. OGB parses each method into an abstract syntax tree and augments the tree with next-token edges; inverse edges are normally added for bidirectional message passing.
      features: AST nodes encode a node type drawn from 97 types, an attribute such as a variable name, depth, and preorder traversal position. The target method name on the root function-definition node, including recursive occurrences, is replaced with a special mask token to prevent direct target leakage. Edge features distinguish AST, next-token, and inverse-edge direction information.
      splits_and_evaluation: The official project split assigns whole repositories to only one of training, validation, or test, testing transfer to unseen codebases. Targets are truncated to five subtokens for the published baseline setup, using a 5,000-subtoken vocabulary plus an unknown token. Performance is the F1 score over predicted and reference subtokens.
      quirks_and_pitfalls: The predecessor ogbg-code dataset is deprecated because method names leaked through the input AST; results from it are not comparable to ogbg-code2. A random method-level split is substantially easier and permits project-specific naming conventions to cross split boundaries. The usual F1 metric is order-insensitive, so it does not fully measure method-name generation quality.
    sources:
    - title: Open Graph Benchmark
      arxiv_id: '2005.00687'

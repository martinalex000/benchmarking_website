  - name: ogbl-ddi
    task_type: link_prediction
    description: Protein-target-split prediction of interactions among FDA-approved and experimental drugs from DrugBank.
    detailed_description:
      task: Rank true drug-drug interaction edges above sampled non-interacting pairs. OGB reports Hits@20 with each positive ranked among approximately 100,000 random negatives.
      data: The homogeneous, undirected, unweighted DrugBank graph contains 4,267 drugs. An edge means the combined effect of the drug pair differs substantially from the effect expected if the drugs acted independently.
      features: The standard graph supplies topology but no intrinsic drug node features or typed interaction labels. Models using molecular structures, targets, or descriptions are adding external data.
      splits_and_evaluation: OGB groups edges using drug protein targets so test drugs predominantly act on proteins different from those associated with train and validation drugs. This tests transfer across mechanisms of action rather than a random edge holdout.
      quirks_and_pitfalls: No edge is not the same as a clinically verified safe combination, and DrugBank includes both approved and experimental compounds. The graph collapses interaction types and direction. External chemical features can radically change the task and must be reported.

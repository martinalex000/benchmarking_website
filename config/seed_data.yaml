      task: Predict binary edge membership in a maximum-cardinality bipartite matching computed by the reference algorithm.
      data: Unique synthetic inputs are sampled from ER, stochastic-block, power-law-cluster, Newman-Watts-Strogatz, BA, and dual-BA generators, with easy, medium, and hard generator-mixture shifts.

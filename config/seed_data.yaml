# Seed data for the Graph Learning Benchmarks database.
# Run with: python -m backend.seed_db

benchmarks:

  - name: LRGB
    arxiv_id: "2206.08164"
    url: "https://arxiv.org/abs/2206.08164"
    description: >
      Long Range Graph Benchmark — five graph ML tasks designed to test
      long-range dependency modelling. Introduced by Dwivedi et al. (2022).
    datasets:

      - name: Peptides-func
        task_type: graph_classification
        description: Multi-label graph classification on peptide molecules (10 classes).
        primary_metric: AP
        higher_is_better: true
        domain: chemistry
        pyg_url: "https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.LRGBDataset.html"
        variants:
          - name: Standard split
            is_standard: true
            notes: "Official random split (80/10/10). Metric: AP (Average Precision)."

      - name: Peptides-struct
        task_type: graph_regression
        description: Multi-task graph regression on peptide structural properties (11 targets).
        primary_metric: MAE
        higher_is_better: false
        domain: chemistry
        pyg_url: "https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.LRGBDataset.html"
        variants:
          - name: Standard split
            is_standard: true
            notes: "Official random split (80/10/10). Metric: MAE (lower is better)."

      - name: PascalVOC-SP
        task_type: node_classification
        description: Node classification on superpixel graphs derived from PascalVOC 2011.
        primary_metric: F1
        higher_is_better: true
        domain: computer_vision
        pyg_url: "https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.LRGBDataset.html"
        variants:
          - name: Standard split
            is_standard: true
            notes: "Official split. Metric: macro F1."

      - name: COCO-SP
        task_type: node_classification
        description: Node classification on superpixel graphs derived from MS-COCO.
        primary_metric: F1
        higher_is_better: true
        domain: computer_vision
        pyg_url: "https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.LRGBDataset.html"
        variants:
          - name: Standard split
            is_standard: true
            notes: "Official split. Metric: macro F1."

      - name: PCQM-Contact
        task_type: link_prediction
        description: Link prediction of spatial atom contacts in quantum chemistry molecules.
        primary_metric: "MRR"
        higher_is_better: true
        domain: chemistry
        pyg_url: "https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.LRGBDataset.html"
        variants:
          - name: Standard split
            is_standard: true
            notes: "Official split. Metric: MRR (Mean Reciprocal Rank). Also reported: Hits@1, Hits@3, Hits@10."

  - name: GraphBench
    arxiv_id: "2512.04475"
    url: "https://arxiv.org/abs/2512.04475"
    description: >
      GraphBench — a comprehensive graph learning benchmark covering diverse
      graph types and tasks spanning social networks, hardware design, logic,
      earth systems, and algorithmic reasoning.
    datasets:

      - name: BlueSky
        task_type: node_classification
        description: >
          Dynamic directed graphs of Bluesky social network user interactions.
          Node-level task: predict future engagement from past interactions and text embeddings.
        primary_metric: MAE
        higher_is_better: false
        domain: social
        pyg_url: "https://graphbench.github.io/website/datasets.html"
        variants:
          - name: Standard split
            is_standard: true
            notes: "3 graphs, 286K–580K nodes, 3M–17M edges. Node-level regression."

      - name: Chip Design
        task_type: graph_generation
        description: >
          Learning to generate small Boolean circuits (and-inverter graphs, AIGs).
          Generation task: produce functionally equivalent, optimised circuits.
        primary_metric: Accuracy
        higher_is_better: true
        domain: hardware
        pyg_url: "https://graphbench.github.io/website/datasets.html"
        variants:
          - name: Standard split
            is_standard: true
            notes: "1.2M graphs, 23–335 nodes, 33–652 edges. Generation task."

      - name: Electronic Circuits
        task_type: graph_classification
        description: >
          Analog circuit topology design. Graph-level task: predict 2 continuous
          performance metrics from graph structure across 3 circuit-size datasets.
        primary_metric: MAE
        higher_is_better: false
        domain: hardware
        pyg_url: "https://graphbench.github.io/website/datasets.html"
        variants:
          - name: Standard split
            is_standard: true
            notes: "93,000 graphs, 13–24 nodes, 30–56 edges. Graph-level regression."

      - name: SAT Solving
        task_type: node_classification
        description: >
          SAT problem instances represented as graphs. Multi-level node/edge/graph-level
          tasks across 11 solvers and 3 instance-size scales.
        primary_metric: Accuracy
        higher_is_better: true
        domain: algorithms
        pyg_url: "https://graphbench.github.io/website/datasets.html"
        variants:
          - name: Standard split
            is_standard: true
            notes: "208,788 graphs, 3 scales. Node/edge/graph-level tasks."
          - name: Small
            is_standard: false
            notes: "SAT solving performance prediction on small instances."
          - name: Medium
            is_standard: false
            notes: "SAT solving performance prediction on medium-scale instances."
          - name: Large
            is_standard: false
            notes: "SAT solving performance prediction on large-scale instances."

      - name: Combinatorial Optimization
        task_type: node_classification
        description: >
          Synthetically generated NP-hard optimization problems (3 families × 2 configs).
          Node/edge/graph-level prediction of optimal solution costs.
        primary_metric: Accuracy
        higher_is_better: true
        domain: algorithms
        pyg_url: "https://graphbench.github.io/website/datasets.html"
        variants:
          - name: Standard split
            is_standard: true
            notes: "300,000 graphs, 200–1,200 nodes. Node/edge/graph-level tasks."

      - name: Algorithmic Reasoning
        task_type: graph_classification
        description: >
          Graphs from 6 generators with 7 algorithmic reasoning tasks (e.g. MST).
          Size generalisation: train on size 16, test up to 2048 nodes.
        primary_metric: Accuracy
        higher_is_better: true
        domain: algorithms
        pyg_url: "https://graphbench.github.io/website/datasets.html"
        variants:
          - name: Standard split
            is_standard: true
            notes: "21M graphs, 3 difficulty levels. Graph/edge-level tasks."

      - name: Weather Forecasting
        task_type: node_classification
        description: >
          ERA5 reanalysis data on a 64×32 icosahedron grid. Node-level task:
          predict 12h residual change in 11 atmospheric variables.
        primary_metric: MAE
        higher_is_better: false
        domain: earth_systems
        pyg_url: "https://graphbench.github.io/website/datasets.html"
        variants:
          - name: Standard split
            is_standard: true
            notes: "93,544 graphs, 4,610 nodes, 7,928 edges. Node-level regression."

      # Graph topology types (Algorithmic Reasoning sub-tasks)
      - name: BA graph
        task_type: graph_classification
        description: Node classification on Barabási–Albert random graphs (GraphBench algorithmic reasoning).
        primary_metric: Accuracy
        higher_is_better: true
        domain: algorithms
        pyg_url: "https://graphbench.github.io/website/datasets.html"
        variants:
          - name: Standard split
            is_standard: true

      - name: ER graph
        task_type: graph_classification
        description: Node classification on Erdős–Rényi random graphs (GraphBench algorithmic reasoning).
        primary_metric: Accuracy
        higher_is_better: true
        domain: algorithms
        pyg_url: "https://graphbench.github.io/website/datasets.html"
        variants:
          - name: Standard split
            is_standard: true

      - name: RB graph
        task_type: graph_classification
        description: Node classification on Random Bipartite graphs (GraphBench algorithmic reasoning).
        primary_metric: Accuracy
        higher_is_better: true
        domain: algorithms
        pyg_url: "https://graphbench.github.io/website/datasets.html"
        variants:
          - name: Standard split
            is_standard: true

      # Algorithmic tasks — easy/medium/hard difficulty variants of the same task
      - name: MST
        task_type: graph_classification
        description: Minimum Spanning Tree edge prediction (GraphBench / CLRS-style algorithmic reasoning).
        primary_metric: F1
        higher_is_better: true
        domain: algorithms
        pyg_url: "https://graphbench.github.io/website/datasets.html"
        variants:
          - name: Standard split
            is_standard: true
          - name: Easy
            is_standard: false
            notes: "Small graph instances."
          - name: Medium
            is_standard: false
            notes: "Medium-scale graph instances."
          - name: Hard
            is_standard: false
            notes: "Large graph instances."

      - name: Bridges
        task_type: graph_classification
        description: Bridge edge detection (GraphBench / CLRS-style algorithmic reasoning).
        primary_metric: F1
        higher_is_better: true
        domain: algorithms
        pyg_url: "https://graphbench.github.io/website/datasets.html"
        variants:
          - name: Standard split
            is_standard: true
          - name: Easy
            is_standard: false
            notes: "Small graph instances."
          - name: Medium
            is_standard: false
            notes: "Medium-scale graph instances."
          - name: Hard
            is_standard: false
            notes: "Large graph instances."

      - name: Max Clique
        task_type: graph_classification
        description: Maximum clique node prediction (GraphBench algorithmic task).
        primary_metric: F1
        higher_is_better: true
        domain: algorithms
        pyg_url: "https://graphbench.github.io/website/datasets.html"
        variants:
          - name: Easy
            is_standard: true
            notes: "Small graph instances."
          - name: Medium
            is_standard: false
            notes: "Medium-scale graph instances."
          - name: Hard
            is_standard: false
            notes: "Large graph instances."

      - name: Max Matching
        task_type: graph_classification
        description: Maximum matching edge prediction (GraphBench algorithmic task).
        primary_metric: F1
        higher_is_better: true
        domain: algorithms
        pyg_url: "https://graphbench.github.io/website/datasets.html"
        variants:
          - name: Easy
            is_standard: true
            notes: "Small graph instances."
          - name: Medium
            is_standard: false
            notes: "Medium-scale graph instances."
          - name: Hard
            is_standard: false
            notes: "Large graph instances."

      - name: Steiner Trees
        task_type: graph_classification
        description: Steiner tree node prediction (GraphBench algorithmic task).
        primary_metric: F1
        higher_is_better: true
        domain: algorithms
        pyg_url: "https://graphbench.github.io/website/datasets.html"
        variants:
          - name: Easy
            is_standard: true
            notes: "Small graph instances."
          - name: Medium
            is_standard: false
            notes: "Medium-scale graph instances."
          - name: Hard
            is_standard: false
            notes: "Large graph instances."

      - name: Topological Sorting
        task_type: node_classification
        description: Topological ordering node rank regression on DAGs (GraphBench algorithmic task).
        primary_metric: MAE
        higher_is_better: false
        domain: algorithms
        pyg_url: "https://graphbench.github.io/website/datasets.html"
        variants:
          - name: Easy
            is_standard: true
            notes: "Small DAGs."
          - name: Medium
            is_standard: false
            notes: "Medium-scale DAGs."
          - name: Hard
            is_standard: false
            notes: "Large DAGs."

      - name: Flow
        task_type: graph_regression
        description: Network flow value prediction (GraphBench / CLRS-style algorithmic reasoning).
        primary_metric: MAE
        higher_is_better: false
        domain: algorithms
        pyg_url: "https://graphbench.github.io/website/datasets.html"
        variants:
          - name: Standard split
            is_standard: true
          - name: Easy
            is_standard: false
            notes: "Small graph instances."
          - name: Medium
            is_standard: false
            notes: "Medium-scale graph instances."
          - name: Hard
            is_standard: false
            notes: "Large graph instances."

  - name: OGB
    arxiv_id: null
    url: "https://ogb.stanford.edu"
    description: >
      Open Graph Benchmark — large-scale standardised graph ML benchmarks covering
      graph-level, node-level, and link-level prediction across diverse domains.
    datasets:

      # ── Graph-level ───────────────────────────────────────────────────────────
      - name: ogbg-molhiv
        task_type: graph_classification
        description: >-
          Binary graph classification on HIV inhibition (molecules).
          Highly imbalanced dataset: only ~3.5% of molecules are active (HIV inhibitors).
          Evaluated with ROC-AUC to account for class imbalance.
        primary_metric: ROC-AUC
        higher_is_better: true
        domain: chemistry
        pyg_url: "https://ogb.stanford.edu/docs/leader_graphprop/#ogbg-molhiv"
        num_graphs: 41127
        avg_nodes: 25.5
        avg_edges: 27.5
        num_classes: 2
        variants:
          - name: Standard split
            is_standard: true
            notes: "Scaffold split. Metric: ROC-AUC."

      - name: ogbg-molpcba
        task_type: graph_classification
        description: Multi-label classification (128 tasks) on PubChem BioAssay.
        primary_metric: AP
        higher_is_better: true
        domain: chemistry
        pyg_url: "https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.OGBDataset.html"
        variants:
          - name: Standard split
            is_standard: true
            notes: "Scaffold split. Metric: AP (Average Precision)."

      - name: Code
        task_type: graph_classification
        description: Code AST-level method name prediction (ogbg-code2). 143k Python snippets.
        primary_metric: F1
        higher_is_better: true
        domain: code
        pyg_url: "https://ogb.stanford.edu/docs/leader_graphprop/#ogbg-code2"
        variants:
          - name: Standard split
            is_standard: true
            notes: "Project-based split."

      # ── Node-level ────────────────────────────────────────────────────────────
      - name: ogbn-arxiv
        task_type: node_classification
        description: Node classification on arXiv citation network (40 subject areas).
        primary_metric: Accuracy
        higher_is_better: true
        domain: citation_networks
        pyg_url: "https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.OGBNodePropPredDataset.html"
        variants:
          - name: Standard split
            is_standard: true
            notes: "Time-based split. Metric: Accuracy."

      - name: ogbn-proteins
        task_type: node_classification
        description: Multi-label binary node classification on protein association network (112 tasks).
        primary_metric: ROC-AUC
        higher_is_better: true
        domain: biology
        pyg_url: "https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.OGBNodePropPredDataset.html"
        variants:
          - name: Standard split
            is_standard: true
            notes: "Species-based split. Metric: ROC-AUC."

      - name: ogbn-products
        task_type: node_classification
        description: Node classification on Amazon product co-purchase graph (47 categories).
        primary_metric: Accuracy
        higher_is_better: true
        domain: e_commerce
        pyg_url: "https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.OGBNodePropPredDataset.html"
        variants:
          - name: Standard split
            is_standard: true
            notes: "Sales-rank split. Metric: Accuracy."

      - name: ogbn-papers100M
        task_type: node_classification
        description: Node classification on 111M academic paper citation network (172 subjects).
        primary_metric: Accuracy
        higher_is_better: true
        domain: citation_networks
        pyg_url: "https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.OGBNodePropPredDataset.html"
        variants:
          - name: Standard split
            is_standard: true

      - name: ogbn-mag
        task_type: node_classification
        description: Heterogeneous academic graph node classification (349 venue classes) from OGB.
        primary_metric: Accuracy
        higher_is_better: true
        domain: citation_networks
        pyg_url: "https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.OGB_MAG.html"
        variants:
          - name: Standard split
            is_standard: true

      # ── Link-level ────────────────────────────────────────────────────────────
      - name: ogbl-collab
        task_type: link_prediction
        description: Link prediction on academic collaboration network (author co-authorship).
        primary_metric: Hits@50
        higher_is_better: true
        domain: citation_networks
        pyg_url: "https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.OGBLinkPropPredDataset.html"
        variants:
          - name: Standard split
            is_standard: true
            notes: "Time-based split. Metric: Hits@50."

      - name: ogbl-ddi
        task_type: link_prediction
        description: Drug-drug interaction link prediction (binary, homogeneous graph).
        primary_metric: Hits@20
        higher_is_better: true
        domain: biology
        pyg_url: "https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.OGBLinkPropPredDataset.html"
        variants:
          - name: Standard split
            is_standard: true
            notes: "Metric: Hits@20."

      - name: ogbl-citation2
        task_type: link_prediction
        description: Citation link prediction on arXiv/PubMed papers (directed).
        primary_metric: MRR
        higher_is_better: true
        domain: citation_networks
        pyg_url: "https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.OGBLinkPropPredDataset.html"
        variants:
          - name: Standard split
            is_standard: true
            notes: "Time-based split. Metric: MRR."

      - name: ogbl-wikikg2
        task_type: link_prediction
        description: Knowledge graph link prediction on Wikidata (2.5M entities, 535 relations).
        primary_metric: MRR
        higher_is_better: true
        domain: knowledge_graphs
        pyg_url: "https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.OGBLinkPropPredDataset.html"
        variants:
          - name: Standard split
            is_standard: true
            notes: "Metric: MRR."

      - name: ogbl-biokg
        task_type: link_prediction
        description: Biological knowledge graph link prediction (5 entity types, 51 relations).
        primary_metric: MRR
        higher_is_better: true
        domain: biology
        pyg_url: "https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.OGBLinkPropPredDataset.html"
        variants:
          - name: Standard split
            is_standard: true
            notes: "Metric: MRR."

      # ── Large-Scale Challenge ────────────────────────────────────────────────
      - name: PCQM4Mv2
        task_type: graph_regression
        description: Quantum chemistry graph regression — predict HOMO-LUMO gap of 3.8M molecules.
        primary_metric: MAE
        higher_is_better: false
        domain: chemistry
        pyg_url: "https://pytorch-geometric.readthedocs.io/en/latest/generated/torch_geometric.datasets.PCQM4Mv2.html"
        variants:
          - name: Standard split
            is_standard: true
            notes: "Scaffold split. Metric: MAE on HOMO-LUMO gap (eV)."



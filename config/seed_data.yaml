        WebKB node classification on Wisconsin university webpages (5 classes).
      features: >-
        Features and edges follow the Geom-GCN/PyG artifact: WebKB uses webpage bag-of-words and hyperlinks, Actor uses film-page keywords and co-occurrence links, and WikipediaNetwork uses page features and hyperlinks.
      splits_and_evaluation: >-

  - name: Combinatorial Optimization
    task_type: graph_regression
    description: >-
      **Graph regression** For maximum independent set, max-cut, and graph coloring instances, the
      supervised task predicts the optimal objective value with MAE. Evaluated by MAE.
    detailed_description:
      task: For maximum independent set, max-cut, and graph coloring instances, the supervised task predicts the optimal objective value with MAE. A separate unsupervised protocol learns variable scores, decodes them to a feasible solution, and evaluates the decoded objective.
      data: Each problem is generated on Barabasi-Albert, Erdos-Renyi, and RB random graphs, with 50,000 instances per dataset and small/large configurations. Solver-generated optima provide supervised labels.
      features: The generated graphs intentionally contain no node or edge features; graph topology defines the optimization instance. Unsupervised variants use problem-specific differentiable surrogate losses and feasibility-preserving decoders.
      splits_and_evaluation: GraphBench fixes generation parameters and splits for each problem, graph family, and size configuration. Supervised MAE and decoded feasible-solution objective are different evaluation settings and must be reported separately.
      quirks_and_pitfalls: Predicting an optimum value is not the same as constructing an optimal solution. Exact labels become expensive or infeasible as instances grow, and random-graph performance need not transfer to structured real-world optimization. The prior YAML incorrectly described the aggregate as node classification.
    sources:
    - title: GraphBench
      arxiv_id: '2512.04475'
      kind: benchmark_definition
    primary_metric: MAE
    higher_is_better: false
    domain: algorithms
    pyg_url: https://graphbench.github.io/website/datasets.html
    variants:
    - name: Standard split
      is_standard: true
  - name: Algorithmic Reasoning
    task_type: graph_classification
    description: >-
      **Mixed node/edge/graph prediction suite** covering topological sorting, maximum flow, MST,
      bridges, Steiner tree, maximum clique, and matching with task-specific node, edge, or graph
      targets. Evaluated by Accuracy.
    detailed_description:
      task: >-
        Simulate seven graph algorithms through node regression, node classification, or
        edge classification: topological sorting, maximum flow, minimum spanning tree,
        bridge finding, Steiner tree, maximum clique, and maximum matching.
      data: Each algorithm has easy, medium, and hard synthetic datasets whose train and test graphs differ in generator distribution. Training graphs have 16 nodes while held-out graphs include 128 nodes, with additional size-generalization tests up to 512 nodes in the published experiments.
      features: Inputs encode the graph, algorithm-specific weights or designated vertices, and task-relevant node or edge attributes. Unlike CLRS-style processor supervision, these datasets focus on final outputs rather than providing a full sequence of algorithmic hints.
      splits_and_evaluation: Fixed 98%/1%/1% splits contain about one million graphs per difficulty for each algorithm. Classification tasks use accuracy and F1; flow and topological-order targets use MAE.
      quirks_and_pitfalls: Difficulty changes both generator distribution and graph size, so failures cannot be attributed to only one axis. Edge tasks are transformed for some node-token baselines. The old YAML's 21-million count is the approximate total across seven tasks, not the size of every individual task.
    sources:
    - title: GraphBench
      arxiv_id: '2512.04475'
      kind: benchmark_definition
    - title: The CLRS Algorithmic Reasoning Benchmark
      arxiv_id: '2205.15659'
      kind: related_protocol
    primary_metric: Accuracy
    higher_is_better: true
    domain: algorithms
    pyg_url: https://graphbench.github.io/website/datasets.html
    variants:
    - name: Standard split
      is_standard: true
  - name: Weather Forecasting
    task_type: node_regression
    description: >-
      **Node regression** Predict the residual change in atmospheric state 12 hours ahead from the two
      preceding six-hour states. Grid nodes contain two consecutive weather states and static location
      information. Evaluated by MAE.
    detailed_description:
      task: Predict the residual change in atmospheric state 12 hours ahead from the two preceding six-hour states. Training uses latitude-, variable-, and pressure-level-weighted MSE; evaluation reports per-variable unweighted MSE.
      data: ERA5 reanalysis is processed through WeatherBench2 and conservatively downsampled to a 64 by 32 global grid at six-hour resolution. The representation includes the latitude-longitude grid, an icosahedral mesh, and mappings between them.
      features: Grid nodes contain two consecutive weather states and static location information. The selected fields include five surface variables and six atmospheric variables across pressure levels, drawn from a larger 62-variable ERA5 state.
      splits_and_evaluation: GraphBench follows chronological WeatherBench-style training and evaluation and uses a fixed 12-hour horizon. Area weighting corrects the unequal physical area of latitude-longitude grid cells during training.
      quirks_and_pitfalls: ERA5 is a model-assisted reanalysis, not direct observation everywhere. Downsampling removes fine spatial structure, and weather preprocessing is substantial. A one-step 12-hour benchmark does not establish stable multi-day rollout or climate-regime generalization.
    sources:
    - title: GraphBench
      arxiv_id: '2512.04475'
      kind: benchmark_definition
    - title: WeatherBench 2
      arxiv_id: '2308.15560'
      kind: processing_source
    - title: ERA5 global reanalysis
      url: https://doi.org/10.1002/qj.3803
      kind: upstream_data_source
    primary_metric: MAE
    higher_is_better: false
    domain: earth_systems
    pyg_url: https://graphbench.github.io/website/datasets.html
    num_graphs: 93544
    avg_nodes: 4610.0

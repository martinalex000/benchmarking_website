    task_type: node_classification
    description: >-
      **112-label node classification** Predict all applicable Gene Ontology-derived function labels
      for each protein. Edges have eight confidence values between zero and one, one per association
      evidence channel. Evaluated by ROC-AUC.
    detailed_description:
      task: Predict all applicable Gene Ontology-derived function labels for each protein. This is 112-task multi-label node classification evaluated by mean ROC-AUC across tasks.
      data: One undirected graph contains 132,534 proteins from eight species and biologically meaningful STRING associations including physical interaction, co-expression, and homology.
      features: Edges have eight confidence values between zero and one, one per association evidence channel. The standard OGB baseline derives node inputs by aggregating incident edge features; users must not assume that independent sequence features are supplied.
      splits_and_evaluation: Protein nodes are divided by species so validation and test require transfer to species not represented by training nodes. ROC-AUC is computed for each of the 112 function labels and then averaged.
      quirks_and_pitfalls: Associations are evidence-weighted rather than verified physical contacts, and confidence channels can reflect database coverage. Function annotation is incomplete, so unannotated functions may not be true biological negatives. Random node splitting breaks the intended cross-species test.

  - name: BA graph
    task_type: graph_regression
    description: >-
      **Graph regression** Predict an optimal combinatorial-objective value in the supervised
      protocol, or learn node scores that a problem-specific decoder turns into a feasible solution in
      the unsupervised protocol. Evaluated by MAE.
    detailed_description:
      task: Predict an optimal combinatorial-objective value in the supervised protocol, or learn node scores that a problem-specific decoder turns into a feasible solution in the unsupervised protocol. GraphBench covers maximum independent set, max-cut, and graph coloring.
      data: Synthetic Barabási–Albert preferential-attachment graphs are generated in small and large regimes. The generator controls graph size and the number of edges attached by each newly added node; GraphBench reports 50,000 instances per dataset.
      features: The released problem graphs contain no node or edge features. Their topology is the input; labels or training losses depend on the selected optimization problem and protocol.
      splits_and_evaluation: Supervised experiments predict the solver-derived optimum and report MAE. Unsupervised experiments minimize a differentiable surrogate, decode node scores to a feasible solution, and evaluate that solution's objective value.
      quirks_and_pitfalls: BA graph names a graph generator, not one classification target. Results must identify the optimization problem, small or large regime, and supervised or unsupervised protocol. Solver-derived labels become expensive and potentially status-dependent for hard instances.
    sources:
    - title: GraphBench
      arxiv_id: '2512.04475'
      kind: benchmark_definition
    - title: Emergence of Scaling in Random Networks
      url: https://doi.org/10.1126/science.286.5439.509
      kind: generator_origin

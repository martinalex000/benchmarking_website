- name: Power Flow Benchmarks
  arxiv_id: '2601.01387'
  url: https://arxiv.org/abs/2601.01387
  description: 'Power grid test cases for scale-adaptive power flow analysis with
    graph neural networks. Cases correspond to standard IEEE power system test networks.

    '
  datasets:
  - name: Case 1
    task_type: graph_regression
    detailed_description:
      task: >-
        Jointly predict active power, reactive power, and voltage magnitude at buses plus
        active and reactive flow in both directions on every branch. The headline accuracy
        is the fraction of operating samples satisfying all stated error thresholds.
      data: >-
        Case I starts from the IEEE 39-bus, 46-branch system. Local Topology Slicing expands
        5,000 selected operating scenarios into one million training subgraphs; separate
        100,000-sample test, downscaled, and upscaled sets probe unseen operating conditions.
      features: >-
        Nodes represent buses with electrical quantities and edges represent transmission elements with network parameters. Inputs, targets, units, slack-bus treatment, and feasibility status follow the benchmark case generator.
      splits_and_evaluation: >-
        The catalog records these protocols or variants: Standard split. Evaluation uses Accuracy (higher is better). Exact masks or folds must come from the cited release.
      quirks_and_pitfalls: >-
        Only converged, feasible operating points should be compared under the documented policy. Per-unit conventions, topology changes, solver tolerances, and bus-type handling can silently alter labels; these cases do not establish transfer to real grids.
    sources:
    - title: Power Flow Benchmarks benchmark
      arxiv_id: '2601.01387'
      kind: benchmark_or_upstream_source
    description: >-
      **Joint node-and-edge regression** Jointly predict active power, reactive power, and voltage
      magnitude at buses plus active and reactive flow in both directions on every branch. Evaluated
      by Accuracy.
    primary_metric: Accuracy
    higher_is_better: true
    domain: power_systems
    variants:
    - name: Standard split
      is_standard: true
    num_graphs: 1000000
  - name: Case 2
    task_type: graph_regression
    detailed_description:
      task: >-
        Jointly predict bus active/reactive power and voltage magnitude plus directional
        branch active/reactive flows on a real provincial grid. Accuracy requires every
        voltage and branch-error threshold to be met for a sample.
      data: >-
        Case II uses 366 days of operational data from an unnamed Chinese provincial grid.
        The first 300 days generate 500,000 training and 100,000 test samples; the remaining
        66 days yield about 150,000 generalization samples with 300--690 buses.
      features: >-
        Nodes represent buses with electrical quantities and edges represent transmission elements with network parameters. Inputs, targets, units, slack-bus treatment, and feasibility status follow the benchmark case generator.
      splits_and_evaluation: >-
        The catalog records these protocols or variants: Standard split. Evaluation uses Accuracy (higher is better). Exact masks or folds must come from the cited release.
      quirks_and_pitfalls: >-
        Only converged, feasible operating points should be compared under the documented policy. Per-unit conventions, topology changes, solver tolerances, and bus-type handling can silently alter labels; these cases do not establish transfer to real grids.
    sources:
    - title: Power Flow Benchmarks benchmark
      arxiv_id: '2601.01387'
      kind: benchmark_or_upstream_source
    description: >-
      **Joint node-and-edge regression** Jointly predict bus active/reactive power and voltage
      magnitude plus directional branch active/reactive flows on a real provincial grid. Evaluated by
      Accuracy.
    primary_metric: Accuracy
    higher_is_better: true
    domain: power_systems
    variants:
    - name: Standard split
      is_standard: true
    num_graphs: 750000

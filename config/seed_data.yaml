      task: Predict the optimal objective value for maximum independent set in the supervised setting, or train node scores with differentiable surrogates and feasibility-preserving decoders for maximum independent set, max-cut, and graph coloring.
      data: RB-model instances contain n groups of k vertices and use a constraint-tightness parameter p; GraphBench rejection-samples to keep graph sizes in configured ranges and provides small and large variants with 50,000 instances per dataset.
      features: The graphs contain no node or edge attributes. Topology encodes the optimization instance and solver outputs supply supervised optimum-value labels where available.
      splits_and_evaluation: Supervised objective prediction is evaluated by MAE. In unsupervised runs, the decoded feasible solution is scored by its achieved objective rather than classification accuracy.

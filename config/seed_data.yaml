- name: LRIM Graph Benchmark
  arxiv_id: null
  url: https://openreview.net/forum?id=IAZXEX1dVV
  source_papers:
  - title: Long-Range Ising Model Graph Benchmark
    url: https://openreview.net/forum?id=IAZXEX1dVV
    role: Benchmark introduction
  description: 'LRIM — the Long-Range Ising Model Graph Benchmark, a physics-grounded suite
    for controlled long-range graph learning evaluation across ten datasets spanning multiple
    graph sizes and difficulty levels.

    '
  datasets:
  - name: LRIM
    task_type: node_regression
    short_description: >-
      Long-Range Ising Model benchmark for per-node energy prediction on periodic 2D grid graphs with
      controllable long-range interactions.
    detailed_description:
      task: >-
        Long-Range Ising Model benchmark for per-node energy prediction on periodic 2D grid graphs with controllable long-range interactions. The primary catalog metric is log-MSE.
      data: >-
        Long-Range Ising Model benchmark for per-node energy prediction on periodic 2D grid graphs with controllable long-range interactions. The cataloged artifact reports 10,000 graphs.
      features: >-
        Nodes occupy a periodic two-dimensional grid and carry spin/state inputs. Edges or interaction terms encode distance-dependent Ising couplings; the release controls interaction range and system size.
      splits_and_evaluation: >-
        The catalog records these protocols or variants: LRIM-16-hard, LRIM-16-easy, LRIM-32-hard, LRIM-32-easy, LRIM-64-hard, LRIM-64-easy, LRIM-128-hard, LRIM-128-easy, LRIM-256-hard, LRIM-256-easy. Evaluation uses log-MSE (lower is better). Exact masks or folds must come from the cited release.
      quirks_and_pitfalls: >-
        Periodic boundaries and long-range couplings distinguish this benchmark from nearest-neighbor grids. Energy conventions, coupling normalization, lattice size, temperature sampling, and interaction cutoff must be reported.
    sources:
    - title: LRIM Graph Benchmark benchmark
      url: https://openreview.net/forum?id=IAZXEX1dVV
      kind: benchmark_or_upstream_source
    - title: PyTorch Geometric LRIM loader documentation

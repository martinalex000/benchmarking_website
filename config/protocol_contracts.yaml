# Positive evidence required before rows can enter a standard leaderboard.
# These are intentionally conservative: an undocumented protocol is not
# comparable merely because the dataset name and task type match.
datasets:
  qm9:
    # Historical QM9 extractions often recorded an explicit standard decision
    # without copying the split sentence into every table row. Keep those
    # rows eligible, while retaining the paper/row exclusions below for
    # transfer, generation, and representation-learning evaluations.
    allow_standard_decision_without_evidence: true
    required_any:
      - "(?:0\\.8\\s*/\\s*0\\.1\\s*/\\s*0\\.1|80\\s*/\\s*10\\s*/\\s*10)"
      - "(?:110(?:,000)?\\s*/\\s*10(?:,000)?\\s*/\\s*10(?:,000)?)"
    forbidden_any:
      - "\\b(?:truncated|synthesi[sz]ed|representative|fabricated|incomplete)\\b"
      - "\\b(?:linear\\s+regression|conditional\\s+generation|transfer\\s+learning)\\b"
  citeseer:
    required_any:
      - "\\bplanetoid\\b"
      - "\\bfixed\\s+(?:planetoid\\s+)?split\\b"
      - "\\byang\\s+et\\s+al\\.?[^.]{0,40}\\b(?:fixed|split)\\b"
    forbidden_any:
      - "\\b(?:5[- ]fold|k[- ]fold|cross[- ]validation|few[- ]shot|label budget|labels?\\s+per\\s+class)\\b"
      - "\\b(?:attack|backdoor|poison|asr|attack success|cta|robustness)\\b"
      - "\\b(?:random|temporal|continual|ood|out[- ]of[- ]distribution)\\b[^.]{0,30}\\bsplit\\b"
      - "\\b(?:48\\s*%?\\s*/\\s*32\\s*%?\\s*/\\s*20\\s*%?|60\\s*%?\\s*/\\s*20\\s*%?\\s*/\\s*20\\s*%?)\\b"
      - "\\b\\d+\\s*%\\s+(?:train|training|validation|val|test|testing)\\b"
  pubmed:
    required_any:
      - "\\bplanetoid\\b"
      - "\\bfixed\\s+(?:planetoid\\s+)?split\\b"
      - "\\byang\\s+et\\s+al\\.?[^.]{0,40}\\b(?:fixed|split)\\b"
    forbidden_any:
      - "\\b(?:random|custom|temporal|continual|few[- ]shot|ood|out[- ]of[- ]distribution)\\b[^.]{0,30}\\b(?:split|partition|setting)\\b"
      - "\\b\\d+\\s*%?\\s*/\\s*\\d+\\s*%?\\s*/\\s*\\d+\\s*%?\\b"
      - "\\b\\d+\\s*%\\s+(?:train|training|validation|val|test|testing)\\b"
  ogbn-arxiv:
    required_any:
      - "\\bofficial\\b[^.]{0,40}\\b(?:ogb|split)\\b"
      - "\\bogb\\b[^.]{0,40}\\b(?:official|default|split)\\b"
      - "\\btransductive\\b[^.]{0,40}\\b(?:ogb|official)\\b"
    forbidden_any:
      - "\\b(?:few[- ]shot|5[- ]way|prompt tuning|linear probing|attack|backdoor|poison|meta[- ]attack|attribute injection|auroc|penn94|csbm)\\b"
      - "\\b(?:selected|balanced|subset|random)\\s+tasks?\\b"
  arxiv-year:
    forbidden_any:
      - "\\b(?:he[_ -]?arxiv|heterogeneous\\s+arxiv|he[_ -]?croval)\\b"
      - "\\b(?:few[- ]shot|zero[- ]shot|co[- ]training|cross[- ]training|linear probing)\\b"
  proteins:
    required_any:
      - "\\b10[- ]fold(?:\\s+cross[- ]validation)?\\b"
      - "\\bten[- ]fold(?:\\s+cross[- ]validation)?\\b"
      - "\\bxu\\s+et\\s+al\\.?[^.]{0,60}\\b(?:split|protocol)\\b"
    forbidden_any:
      - "\\b(?:random\\s+)?(?:80\\s*/\\s*10\\s*/\\s*10|80/10/10)\\s*%?\\b"
      - "\\b(?:random|custom|few[- ]shot|linear probing|temporal|continual)\\b[^.]{0,30}\\b(?:split|partition|setting)\\b"
  wisconsin:
    # WebKB/Wisconsin is comparable only on the public Geom-GCN masks. Some
    # papers call these masks random because they were generated from random
    # seeds; the Pei/Geom-GCN or PyG reference is what distinguishes them from
    # a new random split.
    required_any:
      - "\\b(?:geom[- ]?gcn|geomgcn|pei(?:20(?:19|20))?|pei\\s+et\\s+al\\.?|pytorch\\s+geometric|pyg)\\b[^.]{0,120}\\b(?:fixed|public|random)?\\s*(?:10\\s+)?(?:splits?|seeds?)\\b"
      - "\\b(?:fixed|public|random)?\\s*(?:10\\s+)?(?:splits?|seeds?)\\b[^.]{0,120}\\b(?:geom[- ]?gcn|geomgcn|pei(?:20(?:19|20))?|pei\\s+et\\s+al\\.?|pytorch\\s+geometric|pyg)\\b"
      - "\\b(?:10\\s+)?public\\s+splits?\\b[^.]{0,80}\\b48\\s*%?\\s*/\\s*32\\s*%?\\s*/\\s*20\\s*%?\\b"
    forbidden_any:
      - "\\b60\\s*%?\\s*/\\s*20\\s*%?\\s*/\\s*20\\s*%?\\b"
      - "\\b(?:1[- ]shot|few[- ]shot|90\\s*%\\s*test|cross[- ]validation)\\b"
      - "\\b(?:custom|temporal|continual|ood|out[- ]of[- ]distribution)\\b[^.]{0,40}\\b(?:split|partition|setting)\\b"
    allow_canonical_random_split: true

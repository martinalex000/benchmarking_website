[project]
name = "benchmarking-website"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.5",
    "arxiv>=2.1",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.0",
    "openai>=2.35.1",
    "pydantic>=2.13.4",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "rich>=13",
    "scholarly>=1.7.11",
    "sqlalchemy>=2.0.49",
    "tenacity>=9.1.4",
    "thefuzz>=0.22.1",
    "tqdm>=4.66.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "black>=25.1.0",
    "pre-commit>=4.0.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
pythonpath = ["."]

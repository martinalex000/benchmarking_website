# overrides.yaml — edit this file to correct extraction errors.
# This file is NEVER overwritten by the pipeline.
# Re-run `python -m backend.reapply_overrides --paper 2508.05070` after editing.

paper_arxiv_id: "2508.05070"

model_renames:

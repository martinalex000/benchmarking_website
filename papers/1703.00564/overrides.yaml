# overrides.yaml — edit this file to correct extraction errors.
# This file is NEVER overwritten by the pipeline.
# Re-run `python -m backend.reapply_overrides --paper 1703.00564` after editing.

paper_arxiv_id: "1703.00564"

dataset_split_notes:
  - dataset: "QM7b"
    is_standard_split: true
    note: "The source evaluates QM7b with a random split; the stratified split applies to QM7, not QM7b."

problematic_results:
  - model: "RF"
    dataset: "QM7b"
    metric: "MAE"
    reason: "This is the QM7 result (122.7), incorrectly assigned to QM7b by the extraction."
  - model: "GC"
    dataset: "QM7b"
    metric: "MAE"
    reason: "This is the QM7 result (77.9), incorrectly assigned to QM7b by the extraction."
  - model: "ANI-1"
    dataset: "QM7b"
    metric: "MAE"
    reason: "This is the QM7 result (2.86), incorrectly assigned to QM7b by the extraction."

result_overrides:
  - model: "Multitask(CM)"
    dataset: "QM7b"
    metric: "MAE"
    correct_value: 2.89
    correct_std: 0.65
    reason: "Use the QM7b aggregate test MAE from the QM7/QM7b/QM8/QM9 summary table."
  - model: "KRR(CM)"
    dataset: "QM7b"
    metric: "MAE"
    correct_value: 1.05
    correct_std: 0.06
    reason: "Use the QM7b aggregate test MAE from the QM7/QM7b/QM8/QM9 summary table."
  - model: "DTNN"
    dataset: "QM7b"
    metric: "MAE"
    correct_value: 1.77
    correct_std: 0.17
    reason: "Use the QM7b aggregate test MAE from the QM7/QM7b/QM8/QM9 summary table."


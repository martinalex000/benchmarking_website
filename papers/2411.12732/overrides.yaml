# overrides.yaml — edit this file to correct extraction errors.
# This file is NEVER overwritten by the pipeline.
# Re-run `python -m backend.reapply_overrides --paper 2411.12732` after editing.

paper_arxiv_id: "2411.12732"

# Table 1 reports PascalVOC-SP F1 and standard deviations in percent. The
# extractor normalized most means but missed the corresponding std values (and
# missed the percent conversion for GCN's 0.78 mean).
result_overrides:
  - model: "GCN"
    dataset: "PascalVOC-SP"
    metric: "F1"
    correct_value: 0.0078
    correct_std: 0.0031
    reason: "Table 1 reports 0.78 +/- 0.31 percent; normalize both values to fractions."
  - model: "GINE"
    dataset: "PascalVOC-SP"
    metric: "F1"
    correct_value: 0.2718
    correct_std: 0.0054
    reason: "Table 1 reports 27.18 +/- 0.54 percent; normalize both values to fractions."
  - model: "GatedGCN"
    dataset: "PascalVOC-SP"
    metric: "F1"
    correct_value: 0.388
    correct_std: 0.004
    reason: "Table 1 reports 38.80 +/- 0.40 percent; normalize both values to fractions."
  - model: "CRaWl"

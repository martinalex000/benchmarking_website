# overrides.yaml — edit this file to correct extraction errors.
# This file is NEVER overwritten by the pipeline.
# Re-run `python -m backend.reapply_overrides --paper 2002.08264` after editing.

paper_arxiv_id: "2002.08264"

# The paper uses the split policy described in Section 4.1 rather than one
# uniform split across all MoleculeNet tasks.
dataset_split_notes:
  - dataset: "FreeSolv"
    is_standard_split: true
    note: "Uses a random split, following the Wu2018/Podlewska2018 setup."
  - dataset: "ESOL"
    is_standard_split: true
    note: "Uses a random split, following the Wu2018/Podlewska2018 setup."
  - dataset: "MetStab-low"
    is_standard_split: true
    note: "Uses a random split, following the Wu2018/Podlewska2018 setup."
  - dataset: "MetStab-high"
    is_standard_split: true
    note: "Uses a random split, following the Wu2018/Podlewska2018 setup."
  - dataset: "BBBP"
    is_standard_split: true
    note: "Uses a scaffold split."
  - dataset: "Estrogen-alpha"
    is_standard_split: true
    note: "Uses a scaffold split."
  - dataset: "Estrogen-beta"
    is_standard_split: true
    note: "Uses a scaffold split."


# overrides.yaml — edit this file to correct extraction errors.
# This file is NEVER overwritten by the pipeline.
# Re-run `python -m backend.reapply_overrides --paper 2106.09553` after editing.

paper_arxiv_id: "2106.09553"

model_renames:
  "MoLFormer": "MoLFormer-XL"
  "10% ZINC + 10% PubChem": "MoLFormer (10% ZINC + 10% PubChem)"
  "10% ZINC + 100% PubChem": "MoLFormer (10% ZINC + 100% PubChem)"
  "100% ZINC": "MoLFormer (100% ZINC)"
  "10% Zinc + 10% Pub": "MoLFormer (10% ZINC + 10% PubChem)"
  "10% Zinc + 100% Pub": "MoLFormer (10% ZINC + 100% PubChem)"
  "100% Zinc": "MoLFormer (100% ZINC)"

# The extractor mislabeled the HIV classification metric; the source reports
# ROC-AUC for all six classification benchmarks.
result_overrides:
  - model: "10% ZINC + 10% PubChem"
    dataset: "HIV"
    metric: "Accuracy"
    correct_metric: "ROC-AUC"
    reason: "The source evaluates HIV with ROC-AUC, not Accuracy."
  - model: "10% ZINC + 100% PubChem"
    dataset: "HIV"
    metric: "Accuracy"
    correct_metric: "ROC-AUC"
    reason: "The source evaluates HIV with ROC-AUC, not Accuracy."
  - model: "100% ZINC"
    dataset: "HIV"
    metric: "Accuracy"
    correct_metric: "ROC-AUC"
    reason: "The source evaluates HIV with ROC-AUC, not Accuracy."
  - model: "MoLFormer-Base"
    dataset: "HIV"
    metric: "Accuracy"
    correct_metric: "ROC-AUC"
    reason: "The source evaluates HIV with ROC-AUC, not Accuracy."
  - model: "MoLFormer"
    dataset: "HIV"
    metric: "Accuracy"
    correct_metric: "ROC-AUC"
    reason: "The source evaluates HIV with ROC-AUC, not Accuracy."


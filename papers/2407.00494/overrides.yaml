# overrides.yaml — edit this file to correct extraction errors.
# This file is NEVER overwritten by the pipeline.
# Re-run `python -m backend.reapply_overrides --paper 2407.00494` after editing.

paper_arxiv_id: "2407.00494"

# The benchmark tables label the proposed benchmark variant explicitly as
# "Energy GNN (edge-wise)"; the extractor shortened it to "energy GNN".
model_rename_overrides:
  - model: "energy GNN"
    dataset: "MUTAG"
    renamed_model: "Energy GNN (edge-wise)"
    reason: "Table 3 labels this benchmark variant Energy GNN (edge-wise)."
  - model: "energy GNN"
    dataset: "PROTEINS"
    renamed_model: "Energy GNN (edge-wise)"
    reason: "Table 3 labels this benchmark variant Energy GNN (edge-wise)."
  - model: "energy GNN"
    dataset: "PPI"
    renamed_model: "Energy GNN (edge-wise)"
    reason: "Table 4 labels this benchmark variant Energy GNN (edge-wise)."
  - model: "energy GNN"
    dataset: "Peptides-func"
    renamed_model: "Energy GNN (edge-wise)"
    reason: "Table 1 labels this benchmark variant Energy GNN (edge-wise)."
  - model: "energy GNN"
    dataset: "Peptides-struct"
    renamed_model: "Energy GNN (edge-wise)"
    reason: "Table 5 labels this benchmark variant Energy GNN (edge-wise)."

problematic_results:

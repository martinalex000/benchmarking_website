# Table 3 is labelled test accuracy in the paper; the extraction called it
# ROC-AUC because Questions has ROC-AUC as the dataset-level primary metric.
result_overrides:
  - model: "MLP"
    dataset: "Questions"
    metric: "ROC-AUC"
    correct_metric: "Accuracy"
    reason: "Table 3 reports test accuracy, not ROC-AUC; verified in expanded.tex."
  - model: "GCN"
    dataset: "Questions"
    metric: "ROC-AUC"
    correct_metric: "Accuracy"
    reason: "Table 3 reports test accuracy, not ROC-AUC; verified in expanded.tex."
  - model: "GAT"
    dataset: "Questions"
    metric: "ROC-AUC"
    correct_metric: "Accuracy"
    reason: "Table 3 reports test accuracy, not ROC-AUC; verified in expanded.tex."
  - model: "GraphAny"
    dataset: "Questions"
    metric: "ROC-AUC"
    correct_metric: "Accuracy"
    reason: "Table 3 reports test accuracy, not ROC-AUC; verified in expanded.tex."

